<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The story of Flask</title>
<meta name="description" content="Flask — The Sprint. A cinematic story generated from real git history. Made with Commit Canvas.">
<meta property="og:title" content="The story of Flask">
<meta property="og:description" content="Chapters, a time machine, and a developer fingerprint — generated from real git history. Made with Commit Canvas.">
<meta property="og:type" content="website">
<style>
/* ══════════════════════════════════════════════════════════════════
   COMMIT CANVAS — Story Design System
   Editorial · cinematic dark · system type · zero network requests
   Tokens → components → sections. One visual language everywhere.
   ══════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* surfaces */
  --bg:        #0B0C10;
  --bg-2:      #0E1016;
  --surface:   #12141C;
  --surface-2: #171A24;
  --line:      #232735;
  --line-2:    #2E3344;

  /* ink */
  --ink:       #E9EBF3;
  --ink-2:     #9BA1B5;
  --ink-3:     #687089;

  /* accents */
  --accent:    #E2FF3A;   /* signal — carried over from v1 brand */
  --accent-ink:#151803;
  --amber:     #FFB454;
  --coral:     #FF7A6B;
  --mint:      #6BE7C7;
  --blue:      #6CA6FF;
  --violet:    #B48CFF;

  /* scale */
  --r-s: 8px; --r-m: 12px; --r-l: 18px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-6: 24px; --sp-8: 32px; --sp-12: 48px; --sp-16: 64px; --sp-24: 96px;

  --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono",
          Menlo, Consolas, monospace;

  --shadow-1: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 30px rgba(0,0,0,.35);
  --ease: cubic-bezier(.16,1,.3,1);
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

::selection { background: var(--accent); color: var(--accent-ink); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 4px;
}

.sr-only {
  position: absolute; width: 1px; height: 1px;
  clip: rect(0 0 0 0); overflow: hidden; white-space: nowrap;
}

.mono { font-family: var(--mono); }

.wrap { max-width: 1060px; margin: 0 auto; padding: 0 24px; }
.wrap-tight { max-width: 780px; margin: 0 auto; padding: 0 24px; }

/* ── section scaffolding ─────────────────────────────────────────── */

.sec { padding: var(--sp-24) 0; border-top: 1px solid var(--line); }
.sec:first-of-type { border-top: none; }

.sec-head { margin-bottom: var(--sp-12); max-width: 640px; }

.eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--accent);
  display: block;
  margin-bottom: var(--sp-3);
}

.eyebrow.dim { color: var(--ink-3); }

.sec-head h2 {
  font-size: clamp(26px, 4vw, 36px);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.15;
}

.sec-head .lead { color: var(--ink-2); margin-top: var(--sp-3); font-size: 16px; }

.kicker-row {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--sp-4); flex-wrap: wrap;
}

/* ── chips & badges ──────────────────────────────────────────────── */

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 12px; font-weight: 600;
  letter-spacing: .04em;
  padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--line-2);
  color: var(--ink-2);
  background: var(--surface);
  white-space: nowrap;
}
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.chip-accent {
  background: var(--accent); color: var(--accent-ink);
  border-color: var(--accent);
}

/* ── buttons ─────────────────────────────────────────────────────── */

.btn {
  appearance: none; cursor: pointer;
  font: 600 14px/1 var(--font);
  letter-spacing: .01em;
  border-radius: 10px;
  padding: 13px 20px;
  border: 1px solid var(--line-2);
  background: var(--surface-2); color: var(--ink);
  display: inline-flex; align-items: center; gap: 8px;
  transition: transform .15s var(--ease), background .15s, border-color .15s;
}
.btn:hover { background: #1d2130; border-color: #3a4157; transform: translateY(-1px); }
.btn:active { transform: translateY(0); }

.btn-primary {
  background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
}
.btn-primary:hover { background: #edff6b; border-color: #edff6b; }

/* ── hero ────────────────────────────────────────────────────────── */

.hero {
  min-height: 92svh;
  display: flex; flex-direction: column; justify-content: center;
  position: relative;
  padding: 120px 0 64px;
}

.hero-meta {
  display: flex; gap: var(--sp-4); flex-wrap: wrap; align-items: center;
  margin-bottom: var(--sp-6);
}

.hero h1 {
  font-size: clamp(42px, 8.5vw, 92px);
  font-weight: 800;
  letter-spacing: -0.035em;
  line-height: 1.02;
  word-break: break-word;
}

.hero .datespan {
  font-family: var(--mono);
  color: var(--ink-3); font-size: 14px;
  margin-top: var(--sp-4);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}

.hero .shape {
  margin-top: var(--sp-8);
  max-width: 560px;
}

.hero .shape p { color: var(--ink-2); margin-top: var(--sp-3); font-size: 17px; }

.hero-stats {
  margin-top: var(--sp-12);
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  overflow: hidden;
}

.hero-stat {
  background: var(--bg-2);
  padding: var(--sp-6) var(--sp-4) var(--sp-4);
}

.hero-stat b {
  display: block;
  font-family: var(--mono);
  font-size: clamp(22px, 3.4vw, 32px);
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--ink);
}

.hero-stat span {
  font-size: 12px; color: var(--ink-3);
  font-family: var(--mono); letter-spacing: .08em; text-transform: uppercase;
}

.scroll-cue {
  margin-top: var(--sp-16);
  display: inline-flex; align-items: center; gap: 10px;
  color: var(--ink-3); font-family: var(--mono); font-size: 12px;
  letter-spacing: .14em; text-transform: uppercase;
  text-decoration: none;
}
.scroll-cue svg { animation: cueDrift 2.4s ease-in-out infinite; }
@keyframes cueDrift { 0%,100% { transform: translateY(0);} 50% { transform: translateY(5px);} }

/* ── chapters ────────────────────────────────────────────────────── */

.chapters { display: flex; flex-direction: column; gap: var(--sp-6); }

.chapter {
  display: grid;
  grid-template-columns: 52px 1fr;
  gap: var(--sp-6);
  padding: var(--sp-8);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  position: relative;
  transition: border-color .2s;
}
.chapter:hover { border-color: var(--line-2); }

.chapter .glyph {
  width: 44px; height: 44px;
  display: grid; place-items: center;
  font-size: 20px;
  border-radius: var(--r-m);
  background: var(--surface-2);
  border: 1px solid var(--line-2);
}

.chapter h3 {
  font-size: 21px; letter-spacing: -0.015em; font-weight: 700;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.chapter .when {
  font-family: var(--mono); font-size: 12px; color: var(--ink-3);
  font-weight: 500; letter-spacing: .04em;
}
.chapter .sub { color: var(--ink-2); font-size: 15px; margin-top: 2px; }

.facts { list-style: none; margin-top: var(--sp-4); display: flex; flex-direction: column; gap: 8px; }
.facts li {
  display: flex; gap: 10px; align-items: baseline;
  color: var(--ink-2); font-size: 15px;
}
.facts li::before {
  content: '';
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent); flex: none;
  transform: translateY(-2px);
}
.facts li.q { color: var(--ink); font-style: italic; }

/* ── time machine ────────────────────────────────────────────────── */

.tm { border: 1px solid var(--line); border-radius: var(--r-l); overflow: hidden; background: var(--surface); }

.tm-controls {
  display: flex; align-items: center; gap: var(--sp-4);
  padding: var(--sp-4) var(--sp-6);
  border-bottom: 1px solid var(--line);
  background: var(--bg-2);
  flex-wrap: wrap;
}

.tm-play {
  appearance: none; cursor: pointer; flex: none;
  width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--accent); border: none; color: var(--accent-ink);
  transition: transform .15s var(--ease);
}
.tm-play:hover { transform: scale(1.06); }
.tm-play svg { width: 16px; height: 16px; }

.tm-scrub { flex: 1 1 260px; display: flex; flex-direction: column; gap: 6px; }

.tm-scrub input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 26px; background: transparent; cursor: pointer;
}
.tm-scrub input[type="range"]::-webkit-slider-runnable-track {
  height: 6px; border-radius: 3px;
  background:
    linear-gradient(90deg, var(--accent) var(--fill, 0%), var(--line-2) var(--fill, 0%));
}
.tm-scrub input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 20px; height: 20px; border-radius: 50%;
  background: #fff; margin-top: -7px;
  border: 3px solid var(--accent);
  box-shadow: 0 2px 10px rgba(0,0,0,.5);
}
.tm-scrub input[type="range"]::-moz-range-track {
  height: 6px; border-radius: 3px; background: var(--line-2);
}
.tm-scrub input[type="range"]::-moz-range-progress {
  height: 6px; border-radius: 3px; background: var(--accent);
}
.tm-scrub input[type="range"]::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: #fff; border: 3px solid var(--accent);
}

.tm-date {
  font-family: var(--mono); font-size: 13px; color: var(--ink-2);
  display: flex; justify-content: space-between; gap: 12px;
}
.tm-date b { color: var(--ink); font-weight: 600; }

.tm-body {
  display: grid;
  grid-template-columns: minmax(230px, 320px) 1fr;
  gap: 0;
}
@media (max-width: 860px) { .tm-body { grid-template-columns: 1fr; } }
.tm-right { display: flex; flex-direction: column; min-width: 0; position: relative; }

.tm-counters {
  padding: var(--sp-8) var(--sp-6);
  border-right: 1px solid var(--line);
  display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-6) var(--sp-4);
  align-content: start;
}
@media (max-width: 860px) {
  .tm-counters { border-right: none; border-bottom: 1px solid var(--line); grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 560px) { .tm-counters { grid-template-columns: 1fr 1fr; } }

.tm-counter span {
  font-family: var(--mono); font-size: 11px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-3);
  display: block;
}
.tm-counter b {
  font-family: var(--mono);
  font-size: clamp(20px, 2.6vw, 30px);
  font-weight: 700; letter-spacing: -0.02em;
  display: block; margin-top: 2px;
  font-variant-numeric: tabular-nums;
}
.tm-counter small { color: var(--ink-3); font-size: 12px; font-family: var(--mono); }

.tm-chart { padding: var(--sp-6) var(--sp-6) var(--sp-4); min-width: 0; }
.tm-chart svg { display: block; width: 100%; height: auto; }

.tm-side {
  padding: 0 var(--sp-6) var(--sp-6);
  display: flex; flex-direction: column; gap: var(--sp-4);
}
@media (max-width: 860px) { .tm-side { padding-top: var(--sp-2); } }

.tm-msg {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-m);
  padding: var(--sp-4);
  font-family: var(--mono); font-size: 13px; color: var(--ink-2);
  min-height: 66px;
}
.tm-msg .lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); display: block; margin-bottom: 6px; }

.langbars { display: flex; flex-direction: column; gap: 7px; }
.langbar { display: grid; grid-template-columns: 92px 1fr 40px; gap: 10px; align-items: center; font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.langbar .track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.langbar .fill { height: 100%; border-radius: 3px; transition: width .45s var(--ease); }
.langbar .pc { text-align: right; color: var(--ink-3); }

/* ── rhythm ──────────────────────────────────────────────────────── */

.rhythm-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: var(--sp-6);
}
.rhythm-grid > .panel { min-width: 0; }
.rhythm-grid .cal-scroll { max-width: 100%; }
@media (max-width: 860px) { .rhythm-grid { grid-template-columns: 1fr; } }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  padding: var(--sp-8);
}
.panel h3 { font-size: 16px; letter-spacing: -0.01em; margin-bottom: 4px; }
.panel .psub { color: var(--ink-3); font-size: 13px; margin-bottom: var(--sp-6); font-family: var(--mono); }

.punch-wrap { overflow-x: auto; padding-bottom: 6px; }
.panels > .panel { min-width: 0; }
.punch { display: grid; grid-template-columns: 34px 1fr; gap: 6px; min-width: 560px; }
.punch .prow { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; align-items: center; }
.punch .plabel { font-family: var(--mono); font-size: 11px; color: var(--ink-3); text-align: right; padding-right: 4px; }
.punch .phours { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; margin-top: 6px; }
.punch .phours span { font-family: var(--mono); font-size: 11px; color: var(--ink-3); text-align: center; }
.punch-cell { aspect-ratio: 1; border-radius: 50%; background: var(--surface-2); position: relative; }

.cal-scroll { overflow-x: auto; }
.cal-year { margin-bottom: var(--sp-6); }
.cal-year:last-child { margin-bottom: 0; }
.cal-year .yl { font-family: var(--mono); font-size: 12px; color: var(--ink-3); margin-bottom: 8px; display: flex; justify-content: space-between; }
.cal-row { display: grid; grid-auto-flow: column; grid-auto-columns: 12px; gap: 3px; }
.cal-cell { width: 12px; height: 12px; border-radius: 3px; background: var(--surface-2); }

.c0 { background: var(--surface-2); }
.c1 { background: #3d4422; }
.c2 { background: #7b9a1d; }
.c3 { background: #b8e02e; }
.c4 { background: var(--accent); }

.cal-legend { display: flex; align-items: center; gap: 6px; margin-top: var(--sp-6); font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.cal-legend .cal-cell { width: 10px; height: 10px; }

.streak-facts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); margin-top: var(--sp-6); }
@media (max-width: 560px) { .streak-facts { grid-template-columns: 1fr; } }
.streak-facts .sf { border-left: 2px solid var(--line-2); padding-left: var(--sp-4); }
.streak-facts b { font-family: var(--mono); font-size: 22px; display: block; }
.streak-facts span { color: var(--ink-3); font-size: 12px; font-family: var(--mono); letter-spacing: .06em; text-transform: uppercase; }

/* ── fingerprint ─────────────────────────────────────────────────── */

.fp {
  background:
    radial-gradient(120% 140% at 85% -10%, rgba(226,255,58,.06), transparent 55%),
    var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  padding: clamp(24px, 5vw, 56px);
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  gap: clamp(24px, 4vw, 56px);
}
@media (max-width: 860px) { .fp { grid-template-columns: 1fr; } }

.fp-archetype .a-icon { font-size: 44px; line-height: 1; }
.fp-archetype h3 {
  font-size: clamp(28px, 4vw, 40px);
  letter-spacing: -0.025em; font-weight: 800; margin-top: var(--sp-4);
}
.fp-archetype .a-tag { color: var(--ink-2); font-size: 16px; margin-top: var(--sp-3); max-width: 420px; }
.fp-who { margin-top: var(--sp-8); font-family: var(--mono); font-size: 13px; color: var(--ink-3); }
.fp-who b { color: var(--ink); font-weight: 600; }
.fp-runners { display: flex; gap: 8px; flex-wrap: wrap; margin-top: var(--sp-6); }

.fp-side { display: flex; flex-direction: column; gap: var(--sp-6); }
.hourbars { display: flex; align-items: flex-end; gap: 3px; height: 84px; }
.hourbars div { flex: 1; background: var(--line-2); border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
.hourbars div.hot { background: var(--accent); }
.hour-scale { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-top: 6px; }

.fp-traits { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.fp-traits li { display: flex; gap: 10px; font-size: 14.5px; color: var(--ink-2); }
.fp-traits li::before { content: '▸'; color: var(--accent); }
.fp-note { font-size: 12px; color: var(--ink-3); font-family: var(--mono); margin-top: var(--sp-6); }

/* ── people ──────────────────────────────────────────────────────── */

.people { display: flex; flex-direction: column; gap: var(--sp-3); }

.person {
  display: grid;
  grid-template-columns: 34px minmax(120px, 220px) 1fr auto;
  gap: var(--sp-4);
  align-items: center;
  padding: var(--sp-4);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-m);
}
@media (max-width: 640px) {
  .person { grid-template-columns: 28px 1fr; grid-template-rows: auto auto; }
  .person .pbar-zone { grid-column: 1 / -1; }
}

.person .rank { font-family: var(--mono); color: var(--ink-3); font-size: 13px; }
.person .pname { font-weight: 600; font-size: 15px; word-break: break-word; }
.person .pname small { display: block; color: var(--ink-3); font-weight: 400; font-family: var(--mono); font-size: 11px; margin-top: 2px; }
.pbar-zone { display: flex; align-items: center; gap: 12px; min-width: 0; }
.pbar { flex: 1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.pbar i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.person .pct { font-family: var(--mono); font-size: 13px; color: var(--ink-2); width: 56px; text-align: right; flex: none; }

.badge {
  font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-3);
  margin-left: 8px; vertical-align: 2px;
}
.badge.lead { border-color: var(--accent); color: var(--accent); }

/* ── moment + glow up ────────────────────────────────────────────── */

.duo { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-6); }
@media (max-width: 860px) { .duo { grid-template-columns: 1fr; } }

.moment {
  background:
    radial-gradient(120% 160% at 0% 0%, rgba(226,255,58,.07), transparent 50%),
    var(--surface);
  border: 1px solid var(--line-2);
  border-radius: var(--r-l);
  padding: clamp(24px, 4vw, 44px);
  display: flex; flex-direction: column; gap: var(--sp-4);
}
.moment .m-kind { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
.moment h3 { font-size: clamp(22px, 3vw, 30px); letter-spacing: -0.02em; line-height: 1.2; }
.moment p { color: var(--ink-2); font-size: 15px; }
.moment .m-date { font-family: var(--mono); font-size: 12px; color: var(--ink-3); margin-top: auto; padding-top: var(--sp-4); }

.glowup { display: flex; flex-direction: column; gap: var(--sp-4); }
.glow-row {
  display: grid; grid-template-columns: 1fr 34px 1fr; gap: var(--sp-3);
  align-items: center;
}
.glow-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-m); padding: var(--sp-4) var(--sp-6);
}
.glow-card.when { color: var(--ink-3); font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 6px; }
.glow-card b { font-family: var(--mono); font-size: clamp(17px, 2.4vw, 22px); display: block; }
.glow-card span { color: var(--ink-2); font-size: 13px; }
.glow-arrow { color: var(--accent); display: grid; place-items: center; font-size: 18px; }

/* ── roast ──────────────────────────────────────────────────────── */

.roast { display: flex; flex-direction: column; gap: var(--sp-3); }

   Commit Canvas — GIF89a encoder (pure JS, no dependencies)
   Used by the Export Studio to render Time Machine animations.
   Global palette (sampled across frames + brand colors),

   * encodeGIF({width, height, fps}, getFrame(i) -> RGBA {data}, frameCount, onProgress)

    return new Blob([new Uint8Array(bytes)], { type: "image/gif" });

  function buildTimelineChart(container, months, onChange) {

    var hrs = el("div", "plabel");

    /* calendar */

    Object.keys(byYear).forEach(function (y) {

      var row = el("div", "cal-row");
      byYear[y].forEach(function (pair) {
        var v = pair[1];
        var lvl = v === 0 ? 0 : v <= maxDay * 0.25 ? 1 : v <= maxDay * 0.5 ? 2 : v <= maxDay * 0.75 ? 3 : 4;
        var cell = el("div", "cal-cell c" + lvl);

    p2.appendChild(scroll);
    var legend = el("div", "cal-legend");

      " more";
    p2.appendChild(legend);
    p2.appendChild(el("p", "sr-only",
      "Calendar of daily commits across the project life. " + totalCommits + " commits over " + cal.days.length + " days. Busiest day had " + t.biggest_day + " commits."));

    grid.appendChild(p1); grid.appendChild(p2);
    wrap.appendChild(grid);

    var sf = el("div", "streak-facts");
    var items = [
      [t.longest_streak + " days", "longest streak"],

    });

  }

  /* ── EXPORT STUDIO ────────────────────────────────────────────── */

  var THEMES = {
    dark: { bg: "#0B0C10", ink: "#E9EBF3", dim: "#9BA1B5", faint: "#687089",
            accent: "#E2FF3A", accentInk: "#151803", line: "#2E3344",
            bar: "#7b9a1d", area: "rgba(226,255,58,0.14)" },
    light: { bg: "#F7F7F2", ink: "#14161D", dim: "#4d5261", faint: "#8a8f9e",
             accent: "#7E9A00", accentInk: "#F7F7F2", line: "#d9d9cf",
             bar: "#9db32a", area: "rgba(126,154,0,0.15)" },
  };

  function fitFont(x, text, base, family, weight, maxW) {
    var size = base;
    do {
      x.font = (weight || "700") + " " + size + "px " + family;
      size -= 3;
    } while (x.measureText(text).width > maxW && size > 18);
  }

  function drawCard(d, kind, themeName) {
    var t = d.totals, r = d.repo, sh = d.shape, fp = d.fingerprint;
    var th = THEMES[themeName] || THEMES.dark;
    var W = { og: 1200, square: 1080, story: 1080, banner: 1280 }[kind] || 1200;
    var H = { og: 630, square: 1080, story: 1920, banner: 320 }[kind] || 630;
    var canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = H;
    var x = canvas.getContext && canvas.getContext("2d");
    if (!x) return canvas;
    var MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    var SANS = 'ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';

    x.fillStyle = th.bg; x.fillRect(0, 0, W, H);
    if (themeName !== "light") {
      var glow = x.createRadialGradient(W * 0.85, kind === "story" ? H * 0.1 : -H * 0.15, 10, W * 0.85, kind === "story" ? H * 0.1 : -H * 0.15, W * 0.7);
      glow.addColorStop(0, "rgba(226,255,58,0.13)");
      glow.addColorStop(1, "rgba(226,255,58,0)");
      x.fillStyle = glow; x.fillRect(0, 0, W, H);
    }
    var M = Math.round(W * (kind === "banner" ? 0.025 : 0.05));
    x.strokeStyle = th.line; x.lineWidth = Math.max(2, W / 600);
    x.strokeRect(M, M, W - M * 2, H - M * 2);

    function stat(cx, cy, val, label, vs, ls) {
      x.fillStyle = th.ink;
      x.font = "700 " + vs + "px " + MONO;
      x.fillText(val, cx, cy);
      x.fillStyle = th.faint;
      x.font = "500 " + ls + "px " + MONO;
      x.fillText(label.toUpperCase(), cx, cy + vs * 0.55);
    }
    function spark(sx, sy, sw, shh, lw) {
      var months = d.months;
      var maxC = Math.max.apply(null, months.map(function (m) { return m.commits; })) || 1;
      var step = sw / Math.max(months.length - 1, 1);
      x.beginPath();
      months.forEach(function (m, i) {
        var px = sx + i * step, py = sy + shh - (m.commits / maxC) * shh;
        i ? x.lineTo(px, py) : x.moveTo(px, py);
      });
      x.strokeStyle = th.accent; x.lineWidth = lw; x.lineJoin = "round"; x.stroke();
      x.lineTo(sx + sw, sy + shh); x.lineTo(sx, sy + shh); x.closePath();
      x.fillStyle = th.area; x.fill();
    }
    function tryLetterSpacing(v) { try { x.letterSpacing = v; } catch (e) {} }

    if (kind === "og") {
      x.fillStyle = th.faint; x.font = "600 15px " + MONO;
      tryLetterSpacing("6px");
      x.fillText("THE STORY OF", M + 40, M + 52); tryLetterSpacing("0px");
      x.fillStyle = th.ink;
      fitFont(x, r.name, 66, SANS, "800", W - (M + 40) * 2);
      x.fillText(r.name, M + 40, M + 140);
      x.fillStyle = th.accent; x.font = "700 24px " + SANS;
      x.fillText(sh.label, M + 40, M + 184);
      x.fillStyle = th.dim; x.font = "400 16px " + MONO;
      x.fillText(fmtDate(r.first) + " — " + fmtDate(r.last) + " · " + r.age_label, M + 40, M + 224);
      spark(M + 40, H - 252, W - (M + 40) * 2, 54, 3);
      var gy = H - 160, colW = (W - (M + 40) * 2) / 3;
      var stats = [[fN(t.commits), "commits"], [fN(t.contributors), "contributors"], [fN(t.active_days), "active days"],
                   [t.longest_streak + " days", "longest streak"], [t.night_pct + "%", "at night"], [fK(t.lines_added), "lines added"]];
      stats.forEach(function (s, i) {
        stat(M + 40 + (i % 3) * colW, gy + Math.floor(i / 3) * 78, s[0], s[1], 30, 12);
      });
      x.fillStyle = th.dim; x.font = "600 16px " + SANS;
      x.fillText(fp.archetype.icon + "  " + fp.archetype.label + " — " + fp.author, M + 40, H - M - 52);
      x.fillStyle = th.faint; x.font = "500 13px " + MONO;
      x.fillText("commit canvas · real git data · generated locally", M + 40, H - M - 28);
    } else if (kind === "square") {
      x.textAlign = "center";
      x.fillStyle = th.faint; x.font = "600 22px " + MONO; tryLetterSpacing("8px");
      x.fillText("THE STORY OF", W / 2, M + 110); tryLetterSpacing("0px");
      x.fillStyle = th.ink;
      fitFont(x, r.name, 92, SANS, "800", W - 260);
      x.fillText(r.name, W / 2, M + 240);
      x.fillStyle = th.accent; x.font = "700 40px " + SANS;
      x.fillText(sh.label, W / 2, M + 320);
      x.fillStyle = th.dim; x.font = "400 26px " + MONO;
      x.fillText(fmtDate(r.first) + " — " + fmtDate(r.last) + " · " + r.age_label, W / 2, M + 372);
      spark(M + 110, M + 430, W - 220, 130, 6);
      var colW2 = (W - 220) / 3, gy2 = M + 640;
      var stats2 = [[fN(t.commits), "commits"], [fN(t.active_days), "active days"], [t.longest_streak + "d", "longest streak"],
                    [fN(t.contributors), "contributors"], [t.night_pct + "%", "at night"], [fK(t.lines_added), "lines added"]];
      x.textAlign = "left";
      stats2.forEach(function (s, i) {
        stat(M + 110 + (i % 3) * colW2, gy2 + Math.floor(i / 3) * 150, s[0], s[1], 54, 19);
      });
      x.textAlign = "center";
      x.fillStyle = th.dim; x.font = "600 28px " + SANS;
      x.fillText(fp.archetype.icon + " " + fp.archetype.label, W / 2, H - M - 120);
      x.fillStyle = th.faint; x.font = "500 20px " + MONO;
      x.fillText("commit canvas · generated locally from real git data", W / 2, H - M - 74);
      x.textAlign = "left";
    } else if (kind === "story") {
      x.fillStyle = th.faint; x.font = "600 22px " + MONO; tryLetterSpacing("6px");
      x.fillText("THE STORY OF", M + 40, M + 90); tryLetterSpacing("0px");
      x.fillStyle = th.ink;
      fitFont(x, r.name, 110, SANS, "800", W - (M + 40) * 2);
      x.fillText(r.name, M + 40, M + 210);
      x.fillStyle = th.accent; x.font = "700 34px " + SANS;
      x.fillText(sh.label, M + 40, M + 280);
      x.fillStyle = th.dim; x.font = "400 24px " + MONO;
      x.fillText(fmtDate(r.first) + " — " + fmtDate(r.last) + " · " + r.age_label, M + 40, M + 336);
      var gy3 = M + 470, colW3 = (W - (M + 40) * 2) / 3;
      var stats3 = [[fN(t.commits), "commits"], [fN(t.contributors), "contributors"], [fN(t.active_days), "active days"],
                    [t.longest_streak + " days", "longest streak"], [t.night_pct + "%", "at night"], [fK(t.lines_added), "lines added"]];
      stats3.forEach(function (s, i) {
        stat(M + 40 + (i % 3) * colW3, gy3 + Math.floor(i / 3) * 170, s[0], s[1], 56, 20);
      });
      spark(M + 40, gy3 + 400, W - (M + 40) * 2, 150, 5);
      x.fillStyle = th.dim; x.font = "600 26px " + SANS;
      x.fillText(fp.archetype.icon + "  " + fp.archetype.label + " — " + fp.author, M + 40, H - M - 90);
      x.fillStyle = th.faint; x.font = "500 20px " + MONO;
      x.fillText("commit canvas · real git data · generated locally", M + 40, H - M - 48);
    } else { /* banner */
      x.fillStyle = th.ink;
      fitFont(x, r.name, 58, SANS, "800", 560);
      x.fillText(r.name, M + 36, M + 84);
      x.fillStyle = th.accent; x.font = "700 22px " + SANS;
      x.fillText(sh.label + " · " + r.age_label, M + 36, M + 126);
      x.fillStyle = th.dim; x.font = "400 15px " + MONO;
      x.fillText(fN(t.commits) + " commits · " + fN(t.contributors) + " contributors · " + t.longest_streak + "-day streak", M + 36, H - M - 42);
      spark(660, M + 46, W - 660 - (M + 40), 140, 3);
      x.fillStyle = th.faint; x.font = "500 13px " + MONO;
      x.textAlign = "right";
      x.fillText("commit canvas", W - M - 36, H - M - 42);
      x.textAlign = "left";
    }
    return canvas;
  }

  function svgTimeline(d, W, H) {
    var months = d.months, n = Math.max(months.length, 2);
    var PADL = 10, PADR = 10, PADT = 34, PADB = 26;
    var iw = W - PADL - PADR, ih = H - PADT - PADB;
    var maxM = Math.max.apply(null, months.map(function (m) { return m.commits; })) || 1;
    var cum = 0, cums = months.map(function (m) { return cum += m.commits; });
    var maxC = Math.max(cums[cums.length - 1], 1);
    var s = [];
    s.push('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + " " + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="Commit timeline for ' + esc(d.repo.name) + '">');
    s.push('<rect width="' + W + '" height="' + H + '" fill="#0B0C10"/>');
    s.push('<rect x="8" y="8" width="' + (W - 16) + '" height="' + (H - 16) + '" fill="none" stroke="#2E3344" stroke-width="2" rx="12"/>');
    s.push('<text x="30" y="34" fill="#E9EBF3" font-family="ui-sans-serif,system-ui,sans-serif" font-size="21" font-weight="800">' + esc(d.repo.name) + " — " + esc(d.shape.label) + "</text>");
    s.push('<text x="' + (W - 30) + '" y="34" fill="#687089" font-family="ui-monospace,monospace" font-size="12" text-anchor="end">' + esc(fmtDate(d.repo.first)) + " → " + esc(fmtDate(d.repo.last)) + "</text>");
    var lastYear = null;
    months.forEach(function (m, i) {
      var yr = m.key.slice(0, 4);
      if (yr !== lastYear) {
        lastYear = yr;
        var gx = PADL + (i / (n - 1)) * iw;
        s.push('<line x1="' + gx.toFixed(1) + '" y1="' + PADT + '" x2="' + gx.toFixed(1) + '" y2="' + (H - PADB) + '" stroke="#232735"/>');
        s.push('<text x="' + (gx + 4).toFixed(1) + '" y="' + (H - 8) + '" fill="#687089" font-family="ui-monospace,monospace" font-size="10">' + yr + "</text>");
      }
    });
    var bw = Math.max(2, Math.min(26, iw / n - 2));
    months.forEach(function (m, i) {
      var h = (m.commits / maxM) * ih * 0.62;
      var bx = PADL + (i / (n - 1)) * iw - bw / 2;
      s.push('<rect x="' + bx.toFixed(1) + '" y="' + (PADT + ih - h).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(h, m.commits ? 1.5 : 0).toFixed(1) + '" rx="2" fill="#7b9a1d"/>');
    });
    var path = cums.map(function (c, i) {
      var px = PADL + (i / (n - 1)) * iw;
      var py = PADT + ih - (c / maxC) * ih * 0.92;
      return (i ? "L" : "M") + px.toFixed(1) + " " + py.toFixed(1);
    }).join(" ");
    s.push('<path d="' + path + " L" + (PADL + iw) + " " + (PADT + ih) + " L" + PADL + " " + (PADT + ih) + ' Z" fill="rgba(226,255,58,0.10)"/>');
    s.push('<path d="' + path + '" fill="none" stroke="#E2FF3A" stroke-width="2" stroke-linejoin="round"/>');
    s.push('<text x="30" y="' + (H - 8) + '" fill="#687089" font-family="ui-monospace,monospace" font-size="10">commit canvas · generated from real git data</text>');
    s.push("</svg>");
    return s.join("\n");
  }

  function readmeMarkdown(d) {
    var t = d.totals;
    var lines = [];

    lines.push("");
    lines.push("> " + d.shape.summary + " — story generated with [Commit Canvas](https://github.com/ahmadrrrtx/commit-canvas).");
    lines.push("");
    lines.push("**" + fN(t.commits) + " commits** · **" + fN(t.contributors) + " contributors** · **" +
      fN(t.active_days) + " active days** · longest streak **" + t.longest_streak + " days** · **" + d.repo.age_label + "** of history");
    if (d.chapters.length) {
      lines.push("");
      lines.push("## Chapters");

        lines.push("- **" + c.title + "** — " + (c.facts[0] || c.subtitle || ""));

    lines.push("");

  /* animator shared by GIF + WebM */
  function makeAnimator(d, W, H, themeName) {
    var th = THEMES[themeName] || THEMES.dark;
    var months = d.months, n = Math.max(months.length, 1);
    var MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    var SANS = 'ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif';
    var cum = 0, cums = months.map(function (m) { return cum += m.commits; });
    var people = 0, cpeople = months.map(function (m) { return people += m.new_contributors || 0; });
    var maxM = Math.max.apply(null, months.map(function (m) { return m.commits; })) || 1;
    var hasCode = d.meta.has_code_size && months.some(function (m) { return m.net_end > 0; });

    return { draw: function (x, t) {
      var PADL = Math.round(W * 0.09), PADR = Math.round(W * 0.05);
      var PADT = Math.round(H * 0.38), PADB = Math.round(H * 0.22);
      var iw = W - PADL - PADR, ih = H - PADT - PADB;
      x.fillStyle = th.bg; x.fillRect(0, 0, W, H);
      x.strokeStyle = th.line; x.lineWidth = 2;
      x.strokeRect(14, 14, W - 28, H - 28);

      x.fillStyle = th.faint; x.font = "600 " + Math.round(W / 42) + "px " + MONO;
      x.fillText("T H E   S T O R Y   O F", 40, 56);
      x.fillStyle = th.ink;
      fitFont(x, d.repo.name, Math.round(W / 12), SANS, "800", W - 320);
      x.fillText(d.repo.name, 40, 96);
      x.fillStyle = th.accent; x.font = "700 " + Math.round(W / 34) + "px " + SANS;
      x.fillText(d.shape.label, 40, H - 40);

      x.fillStyle = th.line; x.fillRect(40, H - 22, W - 80, 3);
      x.fillStyle = th.accent; x.fillRect(40, H - 22, (W - 80) * t, 3);

      var cur = t * (n - 1);
      var ci = Math.min(Math.floor(cur), n - 1);
      var month = months[Math.max(ci, 0)];

      x.fillStyle = th.ink;
      x.font = "700 " + Math.round(W / 22) + "px " + MONO;
      x.textAlign = "right";
      x.fillText(month ? month.label : "", W - 40, 96);
      x.textAlign = "left";

      var bw = Math.max(2, Math.min(30, iw / n - 2));
      var lastYear = null;
      months.forEach(function (m, i) {
        if (i > cur) return;
        var frac = i >= cur ? (cur - i) : 1;
        var h = (m.commits / maxM) * ih * 0.75 * (0.25 + 0.75 * Math.max(frac, 0));
        var bx = PADL + (i / (n - 1)) * iw - bw / 2;
        x.fillStyle = i === ci ? th.accent : th.bar;
        x.fillRect(bx, PADT + ih - h, bw, Math.max(h, m.commits ? 2 : 0));
        var yr = m.key.slice(0, 4);
        if (yr !== lastYear) {
          lastYear = yr;
          x.fillStyle = th.faint; x.font = "500 " + Math.round(W / 56) + "px " + MONO;
          x.fillText(yr, PADL + (i / (n - 1)) * iw - 10, PADT + ih + 24);
        }
      });

      x.strokeStyle = th.ink; x.lineWidth = Math.max(1.5, W / 320);
      x.beginPath();
      var started = false;
      for (var i = 0; i <= ci && i < n; i++) {
        var px = PADL + (i / (n - 1)) * iw;
        var py = PADT + ih - (cums[i] / cums[n - 1]) * ih * 0.92;
        started ? x.lineTo(px, py) : (x.moveTo(px, py), started = true);
      }
      x.globalAlpha = 0.75; x.stroke(); x.globalAlpha = 1;

      x.fillStyle = th.dim; x.font = "500 " + Math.round(W / 44) + "px " + MONO;
      var sy = PADT - 26;
      x.textAlign = "right";
      x.fillText(fN(cums[Math.max(ci, 0)]) + " commits", W - 40, sy);
      x.fillText(fN(cpeople[Math.max(ci, 0)]) + " people", W - 40, sy + Math.round(W / 30));
      if (hasCode && month) x.fillText(fN(month.files_end) + " files", W - 40, sy + 2 * Math.round(W / 30));
      x.textAlign = "left";

      if (t > 0.86) {
        var a = Math.min(1, (t - 0.86) / 0.1);
        x.fillStyle = themeName === "light" ? "rgba(247,247,242," + 0.86 * a + ")" : "rgba(11,12,16," + 0.84 * a + ")";
        x.fillRect(14, 14, W - 28, H - 28);
        x.globalAlpha = a;
        x.textAlign = "center";
        x.fillStyle = th.ink;
        x.font = "800 " + Math.round(W / 11) + "px " + SANS;
        x.fillText(fN(d.totals.commits) + " commits", W / 2, H / 2 - W / 14);
        x.fillStyle = th.accent;
        x.font = "700 " + Math.round(W / 24) + "px " + SANS;
        x.fillText(d.shape.label + " · " + d.repo.age_label, W / 2, H / 2 + W / 16);
        x.fillStyle = th.faint;
        x.font = "500 " + Math.round(W / 46) + "px " + MONO;
        x.fillText("commit canvas · your code has a story", W / 2, H / 2 + W / 9);
        x.textAlign = "left";
        x.globalAlpha = 1;
      }
    } };
  }

  function downloadBlob(blob, name) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  }
  function safeName(d) {
    return String(d.repo.name).replace(/[^\w.-]+/g, "_");

  function buildStoryHTML(d) {
    var inject = function (shell) {
      var json = JSON.stringify(d).replace(/</g, "\\u003c").replace(/>/g, "\\u003e");
      return shell.replace("/*__CC_DATA__*/null", "window.__CC_DATA__ = " + json + ";", 1);
    };
    return fetch("canvas.html")
      .then(function (r) { if (!r.ok) throw new Error("no shell"); return r.text(); })
      .then(inject)
      .catch(function () {
        /* file:// fallback — rebuild from the live document */
        var clone = document.documentElement.cloneNode(true);
        var app = clone.querySelector("#app"); if (app) app.innerHTML = "";
        var modal = clone.querySelector(".xs-overlay"); if (modal) modal.remove();
        return "<!DOCTYPE html>\n" + clone.outerHTML;
      });
  }

        .some(function (t) { try { return MediaRecorder.isTypeSupported(t); } catch (e) { return false; } });
  }

    if (!("IntersectionObserver" in window)) return;
    var ids = ["story", "machine", "rhythm", "fingerprint", "people", "moment", "roast", "share"];
    var nav = el("nav", "dotnav");
    nav.setAttribute("aria-label", "Sections");
    var links = {};
    ids.forEach(function (id) {
      var a = el("a");
      a.href = "#" + id;
      a.title = id;
      a.setAttribute("aria-label", "Jump to " + id);
      links[id] = a;
      nav.appendChild(a);
    });
    root.appendChild(nav);
    var obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) {
          for (var k in links) links[k].classList.toggle("on", k === e.target.id);
        }
      });
    }, { rootMargin: "-40% 0px -55% 0px" });
    ids.forEach(function (id) {
      var target = document.getElementById(id);
      if (target) obs.observe(target);
    });
  }

  function activateReveals() {
    var nodes = document.querySelectorAll(".reveal");
    if (REDUCED || !("IntersectionObserver" in window)) {
      nodes.forEach(function (n) { n.classList.add("in"); });
      return;
    }
    var obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add("in"); obs.unobserve(e.target); }
      });
    }, { threshold: 0.08 });
    nodes.forEach(function (n) { obs.observe(n); });
  }

  /* ── public API ───────────────────────────────────────────────── */

  function render(container, data, opts) {
    opts = opts || {};
    container.innerHTML = "";
    document.title = "The story of " + data.repo.name;
    hero(container, data);
    chapters(container, data);
    timeMachine(container, data);
    rhythm(container, data);
    fingerprint(container, data);
    people(container, data);
    momentAndGlowup(container, data);
    roast(container, data);
    certificate(container, data);
    footer(container, data);
    dotNav(container, data);
    activateReveals();
  }

  window.CommitCanvas = { render: render, openExportStudio: openExportStudio, drawCard: drawCard, svgTimeline: svgTimeline, readmeMarkdown: readmeMarkdown, buildStoryHTML: buildStoryHTML, esc: esc, fN: fN, fK: fK, fmtDate: fmtDate };

  /* auto-mount when embedded as a story file */
  var mount = document.getElementById("app");
  if (mount && window.__CC_DATA__ && window.__CC_DATA__.repo) {
    try { render(mount, window.__CC_DATA__); }
    catch (err) {
      mount.innerHTML = "<div class='wrap' style='padding:20vh 24px'><h1>Something broke while drawing this story.</h1><p style='color:#9BA1B5;margin-top:12px'>" +
        String(err && err.message ? err.message : err) + "</p></div>";
    }
  }
})();

</script>
