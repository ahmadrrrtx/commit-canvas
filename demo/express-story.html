<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The story of express</title>
<meta name="description" content="express — The Return. A cinematic story generated from real git history. Made with Commit Canvas.">
<meta property="og:title" content="The story of express">
<meta property="og:description" content="Chapters, a time machine, and a developer fingerprint — generated from real git history. Made with Commit Canvas.">
<meta property="og:type" content="website">
<style>
/* ══════════════════════════════════════════════════════════════════
   COMMIT CANVAS — Story Design System
   Editorial · cinematic dark · system type · zero network requests
   Tokens → components → sections. One visual language everywhere.
   ══════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* surfaces */
  --bg:        #0B0C10;
  --bg-2:      #0E1016;
  --surface:   #12141C;
  --surface-2: #171A24;
  --line:      #232735;
  --line-2:    #2E3344;

  /* ink */
  --ink:       #E9EBF3;
  --ink-2:     #9BA1B5;
  --ink-3:     #687089;

  /* accents */
  --accent:    var(--accent);   /* signal — carried over from v1 brand */
  --accent-ink:#151803;
  --amber:     #FFB454;
  --coral:     #FF7A6B;
  --mint:      #6BE7C7;
  --blue:      #6CA6FF;
  --violet:    #B48CFF;

  /* scale */
  --r-s: 8px; --r-m: 12px; --r-l: 18px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-6: 24px; --sp-8: 32px; --sp-12: 48px; --sp-16: 64px; --sp-24: 96px;

  --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono",
          Menlo, Consolas, monospace;

  --shadow-1: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 30px rgba(0,0,0,.35);
  --ease: cubic-bezier(.16,1,.3,1);
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

::selection { background: var(--accent); color: var(--accent-ink); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 4px;
}

.sr-only {
  position: absolute; width: 1px; height: 1px;
  clip: rect(0 0 0 0); overflow: hidden; white-space: nowrap;
}

.mono { font-family: var(--mono); }

.wrap { max-width: 1060px; margin: 0 auto; padding: 0 24px; }
.wrap-tight { max-width: 780px; margin: 0 auto; padding: 0 24px; }

/* ── section scaffolding ─────────────────────────────────────────── */

.sec { padding: var(--sp-24) 0; border-top: 1px solid var(--line); }
.sec:first-of-type { border-top: none; }

.sec-head { margin-bottom: var(--sp-12); max-width: 640px; }

.eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--accent);
  display: block;
  margin-bottom: var(--sp-3);
}

.eyebrow.dim { color: var(--ink-3); }

.sec-head h2 {
  font-size: clamp(26px, 4vw, 36px);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.15;
}

.sec-head .lead { color: var(--ink-2); margin-top: var(--sp-3); font-size: 16px; }

.kicker-row {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--sp-4); flex-wrap: wrap;
}

/* ── chips & badges ──────────────────────────────────────────────── */

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 12px; font-weight: 600;
  letter-spacing: .04em;
  padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--line-2);
  color: var(--ink-2);
  background: var(--surface);
  white-space: nowrap;
}
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.chip-accent {
  background: var(--accent); color: var(--accent-ink);
  border-color: var(--accent);
}

/* ── buttons ─────────────────────────────────────────────────────── */

.btn {
  appearance: none; cursor: pointer;
  font: 600 14px/1 var(--font);
  letter-spacing: .01em;
  border-radius: 10px;
  padding: 13px 20px;
  border: 1px solid var(--line-2);
  background: var(--surface-2); color: var(--ink);
  display: inline-flex; align-items: center; gap: 8px;
  transition: transform .15s var(--ease), background .15s, border-color .15s;
}
.btn:hover { background: #1d2130; border-color: #3a4157; transform: translateY(-1px); }
.btn:active { transform: translateY(0); }

.btn-primary {
  background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
}
.btn-primary:hover { background: #edff6b; border-color: #edff6b; }

/* ── hero ────────────────────────────────────────────────────────── */

.hero {
  min-height: 92svh;
  display: flex; flex-direction: column; justify-content: center;
  position: relative;
  padding: 120px 0 64px;
}

.hero-meta {
  display: flex; gap: var(--sp-4); flex-wrap: wrap; align-items: center;
  margin-bottom: var(--sp-6);
}

.hero h1 {
  font-size: clamp(42px, 8.5vw, 92px);
  font-weight: 800;
  letter-spacing: -0.035em;
  line-height: 1.02;
  word-break: break-word;
}

.hero .datespan {
  font-family: var(--mono);
  color: var(--ink-3); font-size: 14px;
  margin-top: var(--sp-4);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}

.hero .shape {
  margin-top: var(--sp-8);
  max-width: 560px;
}

.hero .shape p { color: var(--ink-2); margin-top: var(--sp-3); font-size: 17px; }

.hero-stats {
  margin-top: var(--sp-12);
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  overflow: hidden;
}

.hero-stat {
  background: var(--bg-2);
  padding: var(--sp-6) var(--sp-4) var(--sp-4);
}

.hero-stat b {
  display: block;
  font-family: var(--mono);
  font-size: clamp(22px, 3.4vw, 32px);
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--ink);
}

.hero-stat span {
  font-size: 12px; color: var(--ink-3);
  font-family: var(--mono); letter-spacing: .08em; text-transform: uppercase;
}

.scroll-cue {
  margin-top: var(--sp-16);
  display: inline-flex; align-items: center; gap: 10px;
  color: var(--ink-3); font-family: var(--mono); font-size: 12px;
  letter-spacing: .14em; text-transform: uppercase;
  text-decoration: none;
}
.scroll-cue svg { animation: cueDrift 2.4s ease-in-out infinite; }
@keyframes cueDrift { 0%,100% { transform: translateY(0);} 50% { transform: translateY(5px);} }

/* ── chapters ────────────────────────────────────────────────────── */

.chapters { display: flex; flex-direction: column; gap: var(--sp-6); }

.chapter {
  display: grid;
  grid-template-columns: 52px 1fr;
  gap: var(--sp-6);
  padding: var(--sp-8);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  position: relative;
  transition: border-color .2s;
}
.chapter:hover { border-color: var(--line-2); }

.chapter .glyph {
  width: 44px; height: 44px;
  display: grid; place-items: center;
  font-size: 20px;
  border-radius: var(--r-m);
  background: var(--surface-2);
  border: 1px solid var(--line-2);
}

.chapter h3 {
  font-size: 21px; letter-spacing: -0.015em; font-weight: 700;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.chapter .when {
  font-family: var(--mono); font-size: 12px; color: var(--ink-3);
  font-weight: 500; letter-spacing: .04em;
}
.chapter .sub { color: var(--ink-2); font-size: 15px; margin-top: 2px; }

.facts { list-style: none; margin-top: var(--sp-4); display: flex; flex-direction: column; gap: 8px; }
.facts li {
  display: flex; gap: 10px; align-items: baseline;
  color: var(--ink-2); font-size: 15px;
}
.facts li::before {
  content: '';
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent); flex: none;
  transform: translateY(-2px);
}
.facts li.q { color: var(--ink); font-style: italic; }

/* ── time machine ────────────────────────────────────────────────── */

.tm { border: 1px solid var(--line); border-radius: var(--r-l); overflow: hidden; background: var(--surface); }

.tm-controls {
  display: flex; align-items: center; gap: var(--sp-4);
  padding: var(--sp-4) var(--sp-6);
  border-bottom: 1px solid var(--line);
  background: var(--bg-2);
  flex-wrap: wrap;
}

.tm-play {
  appearance: none; cursor: pointer; flex: none;
  width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--accent); border: none; color: var(--accent-ink);
  transition: transform .15s var(--ease);
}
.tm-play:hover { transform: scale(1.06); }
.tm-play svg { width: 16px; height: 16px; }

.tm-scrub { flex: 1 1 260px; display: flex; flex-direction: column; gap: 6px; }

.tm-scrub input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 26px; background: transparent; cursor: pointer;
}
.tm-scrub input[type="range"]::-webkit-slider-runnable-track {
  height: 6px; border-radius: 3px;
  background:
    linear-gradient(90deg, var(--accent) var(--fill, 0%), var(--line-2) var(--fill, 0%));
}
.tm-scrub input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 20px; height: 20px; border-radius: 50%;
  background: #fff; margin-top: -7px;
  border: 3px solid var(--accent);
  box-shadow: 0 2px 10px rgba(0,0,0,.5);
}
.tm-scrub input[type="range"]::-moz-range-track {
  height: 6px; border-radius: 3px; background: var(--line-2);
}
.tm-scrub input[type="range"]::-moz-range-progress {
  height: 6px; border-radius: 3px; background: var(--accent);
}
.tm-scrub input[type="range"]::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: #fff; border: 3px solid var(--accent);
}

.tm-date {
  font-family: var(--mono); font-size: 13px; color: var(--ink-2);
  display: flex; justify-content: space-between; gap: 12px;
}
.tm-date b { color: var(--ink); font-weight: 600; }

.tm-body {
  display: grid;
  grid-template-columns: minmax(230px, 320px) 1fr;
  gap: 0;
}
@media (max-width: 860px) { .tm-body { grid-template-columns: 1fr; } }
.tm-right { display: flex; flex-direction: column; min-width: 0; position: relative; }

.tm-counters {
  padding: var(--sp-8) var(--sp-6);
  border-right: 1px solid var(--line);
  display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-6) var(--sp-4);
  align-content: start;
}
@media (max-width: 860px) {
  .tm-counters { border-right: none; border-bottom: 1px solid var(--line); grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 560px) { .tm-counters { grid-template-columns: 1fr 1fr; } }

.tm-counter span {
  font-family: var(--mono); font-size: 11px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-3);
  display: block;
}
.tm-counter b {
  font-family: var(--mono);
  font-size: clamp(20px, 2.6vw, 30px);
  font-weight: 700; letter-spacing: -0.02em;
  display: block; margin-top: 2px;
  font-variant-numeric: tabular-nums;
}
.tm-counter small { color: var(--ink-3); font-size: 12px; font-family: var(--mono); }

.tm-chart { padding: var(--sp-6) var(--sp-6) var(--sp-4); min-width: 0; }
.tm-chart svg { display: block; width: 100%; height: auto; }

.tm-side {
  padding: 0 var(--sp-6) var(--sp-6);
  display: flex; flex-direction: column; gap: var(--sp-4);
}
@media (max-width: 860px) { .tm-side { padding-top: var(--sp-2); } }

.tm-msg {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-m);
  padding: var(--sp-4);
  font-family: var(--mono); font-size: 13px; color: var(--ink-2);
  min-height: 66px;
}
.tm-msg .lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); display: block; margin-bottom: 6px; }

.langbars { display: flex; flex-direction: column; gap: 7px; }
.langbar { display: grid; grid-template-columns: 92px 1fr 40px; gap: 10px; align-items: center; font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.langbar .track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.langbar .fill { height: 100%; border-radius: 3px; transition: width .45s var(--ease); }
.langbar .pc { text-align: right; color: var(--ink-3); }

/* ── rhythm ──────────────────────────────────────────────────────── */

.rhythm-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: var(--sp-6);
}
.rhythm-grid > .panel { min-width: 0; }
.rhythm-grid .cal-scroll { max-width: 100%; }
@media (max-width: 860px) { .rhythm-grid { grid-template-columns: 1fr; } }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  padding: var(--sp-8);
}
.panel h3 { font-size: 16px; letter-spacing: -0.01em; margin-bottom: 4px; }
.panel .psub { color: var(--ink-3); font-size: 13px; margin-bottom: var(--sp-6); font-family: var(--mono); }

.punch-wrap { overflow-x: auto; padding-bottom: 6px; }
.panels > .panel { min-width: 0; }
.punch { display: grid; grid-template-columns: 34px 1fr; gap: 6px; min-width: 560px; }
.punch .prow { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; align-items: center; }
.punch .plabel { font-family: var(--mono); font-size: 11px; color: var(--ink-3); text-align: right; padding-right: 4px; }
.punch .phours { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; margin-top: 6px; }
.punch .phours span { font-family: var(--mono); font-size: 11px; color: var(--ink-3); text-align: center; }
.punch-cell { aspect-ratio: 1; border-radius: 50%; background: var(--surface-2); position: relative; }

.cal-scroll { overflow-x: auto; }
.cal-year { margin-bottom: var(--sp-6); }
.cal-year:last-child { margin-bottom: 0; }
.cal-year .yl { font-family: var(--mono); font-size: 12px; color: var(--ink-3); margin-bottom: 8px; display: flex; justify-content: space-between; }
.cal-row { display: grid; grid-auto-flow: column; grid-auto-columns: 12px; gap: 3px; }
.cal-cell { width: 12px; height: 12px; border-radius: 3px; background: var(--surface-2); }

.c0 { background: var(--surface-2); }
.c1 { background: #3d4422; }
.c2 { background: #7b9a1d; }
.c3 { background: #b8e02e; }
.c4 { background: var(--accent); }

.cal-legend { display: flex; align-items: center; gap: 6px; margin-top: var(--sp-6); font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.cal-legend .cal-cell { width: 10px; height: 10px; }

.streak-facts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); margin-top: var(--sp-6); }
@media (max-width: 560px) { .streak-facts { grid-template-columns: 1fr; } }
.streak-facts .sf { border-left: 2px solid var(--line-2); padding-left: var(--sp-4); }
.streak-facts b { font-family: var(--mono); font-size: 22px; display: block; }
.streak-facts span { color: var(--ink-3); font-size: 12px; font-family: var(--mono); letter-spacing: .06em; text-transform: uppercase; }

/* ── fingerprint ─────────────────────────────────────────────────── */

.fp {
  background:
    radial-gradient(120% 140% at 85% -10%, rgba(var(--accent-rgb),.06), transparent 55%),
    var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  padding: clamp(24px, 5vw, 56px);
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  gap: clamp(24px, 4vw, 56px);
}
@media (max-width: 860px) { .fp { grid-template-columns: 1fr; } }

.fp-archetype .a-icon { font-size: 44px; line-height: 1; }
.fp-archetype h3 {
  font-size: clamp(28px, 4vw, 40px);
  letter-spacing: -0.025em; font-weight: 800; margin-top: var(--sp-4);
}
.fp-archetype .a-tag { color: var(--ink-2); font-size: 16px; margin-top: var(--sp-3); max-width: 420px; }
.fp-who { margin-top: var(--sp-8); font-family: var(--mono); font-size: 13px; color: var(--ink-3); }
.fp-who b { color: var(--ink); font-weight: 600; }
.fp-runners { display: flex; gap: 8px; flex-wrap: wrap; margin-top: var(--sp-6); }

.fp-side { display: flex; flex-direction: column; gap: var(--sp-6); }
.hourbars { display: flex; align-items: flex-end; gap: 3px; height: 84px; }
.hourbars div { flex: 1; background: var(--line-2); border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
.hourbars div.hot { background: var(--accent); }
.hour-scale { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-top: 6px; }

.fp-traits { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.fp-traits li { display: flex; gap: 10px; font-size: 14.5px; color: var(--ink-2); }
.fp-traits li::before { content: '▸'; color: var(--accent); }
.fp-note { font-size: 12px; color: var(--ink-3); font-family: var(--mono); margin-top: var(--sp-6); }

/* ── people ──────────────────────────────────────────────────────── */

.people { display: flex; flex-direction: column; gap: var(--sp-3); }

.person {
  display: grid;
  grid-template-columns: 34px minmax(120px, 220px) 1fr auto;
  gap: var(--sp-4);
  align-items: center;
  padding: var(--sp-4);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-m);
}
@media (max-width: 640px) {
  .person { grid-template-columns: 28px 1fr; grid-template-rows: auto auto; }
  .person .pbar-zone { grid-column: 1 / -1; }
}

.person .rank { font-family: var(--mono); color: var(--ink-3); font-size: 13px; }
.person .pname { font-weight: 600; font-size: 15px; word-break: break-word; }
.person .pname small { display: block; color: var(--ink-3); font-weight: 400; font-family: var(--mono); font-size: 11px; margin-top: 2px; }
.pbar-zone { display: flex; align-items: center; gap: 12px; min-width: 0; }
.pbar { flex: 1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.pbar i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.person .pct { font-family: var(--mono); font-size: 13px; color: var(--ink-2); width: 56px; text-align: right; flex: none; }

.badge {
  font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-3);
  margin-left: 8px; vertical-align: 2px;
}
.badge.lead { border-color: var(--accent); color: var(--accent); }

/* ── moment + glow up ────────────────────────────────────────────── */

.duo { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-6); }
@media (max-width: 860px) { .duo { grid-template-columns: 1fr; } }

.moment {
  background:
    radial-gradient(120% 160% at 0% 0%, rgba(var(--accent-rgb),.07), transparent 50%),
    var(--surface);
  border: 1px solid var(--line-2);
  border-radius: var(--r-l);
  padding: clamp(24px, 4vw, 44px);
  display: flex; flex-direction: column; gap: var(--sp-4);
}
.moment .m-kind { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
.moment h3 { font-size: clamp(22px, 3vw, 30px); letter-spacing: -0.02em; line-height: 1.2; }
.moment p { color: var(--ink-2); font-size: 15px; }
.moment .m-date { font-family: var(--mono); font-size: 12px; color: var(--ink-3); margin-top: auto; padding-top: var(--sp-4); }

.glowup { display: flex; flex-direction: column; gap: var(--sp-4); }
.glow-row {
  display: grid; grid-template-columns: 1fr 34px 1fr; gap: var(--sp-3);
  align-items: center;
}
.glow-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-m); padding: var(--sp-4) var(--sp-6);
}
.glow-card.when { color: var(--ink-3); font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 6px; }
.glow-card b { font-family: var(--mono); font-size: clamp(17px, 2.4vw, 22px); display: block; }
.glow-card span { color: var(--ink-2); font-size: 13px; }
.glow-arrow { color: var(--accent); display: grid; place-items: center; font-size: 18px; }

/* ── roast ──────────────────────────────────────────────────────── */

.roast { display: flex; flex-direction: column; gap: var(--sp-3); }
.quip {
  display: flex; justify-content: space-between; align-items: center; gap: var(--sp-6);
  padding: var(--sp-4) var(--sp-6);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m);
}
.quip p { font-size: 16px; }
.quip .evidence {
  font-family: var(--mono); font-size: 11px; color: var(--ink-3);
  white-space: nowrap; flex: none;
  border: 1px solid var(--line); padding: 3px 9px; border-radius: 999px;
}
@media (max-width: 560px) {
  .quip { flex-direction: column; align-items: flex-start; gap: 8px; }
}

/* ── certificate / share ────────────────────────────────────────── */

.cert-zone { display: grid; grid-template-columns: 1fr; gap: var(--sp-8); }

.cert {
  border: 1px solid var(--line-2);
  border-radius: var(--r-l);
  background:
    radial-gradient(130% 120% at 50% -20%, rgba(var(--accent-rgb),.08), transparent 55%),
    var(--surface);
  padding: clamp(28px, 5vw, 56px);
  text-align: center;
  position: relative;
  overflow: hidden;
}
.cert::before, .cert::after {
  content: ''; position: absolute; width: 120px; height: 120px;
  border: 1px solid var(--line-2); opacity: .6;
}
.cert::before { top: 14px; left: 14px; border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
.cert::after { bottom: 14px; right: 14px; border-left: none; border-top: none; border-radius: 0 0 8px 0; }

.cert .c-eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .3em; color: var(--ink-3); text-transform: uppercase; }
.cert h3 { font-size: clamp(30px, 5vw, 52px); letter-spacing: -0.03em; margin: var(--sp-4) 0; word-break: break-word; }
.cert .c-shape { color: var(--accent); font-weight: 600; font-size: 18px; }
.cert .c-stats {
  display: flex; justify-content: center; gap: var(--sp-6); flex-wrap: wrap;
  margin: var(--sp-8) 0;
  font-family: var(--mono);
}
.cert .c-stats div b { display: block; font-size: 22px; }
.cert .c-stats div span { color: var(--ink-3); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.cert .c-fp { font-size: 14px; color: var(--ink-2); }
.cert .c-fp b { color: var(--ink); }
.cert .c-foot { margin-top: var(--sp-8); font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: .12em; }

.share-actions { display: flex; gap: var(--sp-3); flex-wrap: wrap; justify-content: center; margin-top: var(--sp-8); }

.share-preview { text-align: center; }
.share-preview canvas {
  max-width: 100%; height: auto; border-radius: var(--r-m);
  border: 1px solid var(--line-2);
  box-shadow: var(--shadow-1);
}

/* ── footer ─────────────────────────────────────────────────────── */

.foot {
  border-top: 1px solid var(--line);
  padding: var(--sp-16) 0 var(--sp-16);
  color: var(--ink-3); font-size: 14px;
}
.foot-grid { display: flex; justify-content: space-between; gap: var(--sp-6); flex-wrap: wrap; align-items: flex-end; }
.foot .brand { font-weight: 700; color: var(--ink); letter-spacing: -0.01em; font-size: 18px; }
.foot .cmd {
  font-family: var(--mono); font-size: 12px; color: var(--ink-2);
  background: var(--bg-2); border: 1px solid var(--line);
  padding: 8px 12px; border-radius: 8px; margin-top: 8px; display: inline-block;
}
.foot a { color: var(--ink-2); }

.meta-notes { margin-top: var(--sp-6); font-family: var(--mono); font-size: 12px; color: var(--ink-3); display: flex; flex-direction: column; gap: 4px; }

/* ── dot nav (desktop) ──────────────────────────────────────────── */

.dotnav {
  position: fixed; right: 22px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 12px; z-index: 40;
}
@media (max-width: 1240px), (prefers-reduced-motion: reduce) { .dotnav { display: none; } }
.dotnav a {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--line-2); display: block;
  transition: background .2s, transform .2s;
}
.dotnav a.on { background: var(--accent); transform: scale(1.35); }
.dotnav a:hover { background: var(--ink-3); }

/* ── reveal on scroll ────────────────────────────────────────────── */

.reveal { opacity: 0; transform: translateY(22px); transition: opacity .7s var(--ease), transform .7s var(--ease); }
.reveal.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
  html { scroll-behavior: auto; }
  .scroll-cue svg { animation: none; }
  * { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
}

/* ── hero entrance ──────────────────────────────────────────────── */

.hero-in { opacity: 0; transform: translateY(14px); animation: heroIn .9s var(--ease) forwards; }
.hero-in.d1 { animation-delay: .08s; } .hero-in.d2 { animation-delay: .16s; }
.hero-in.d3 { animation-delay: .26s; } .hero-in.d4 { animation-delay: .4s; }
.hero-in.d5 { animation-delay: .55s; }
@keyframes heroIn { to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .hero-in { animation: none; opacity: 1; transform: none; } }

/* ── time machine v2: transport, ticks, events ─────────────────── */

.tm-transport { display: flex; align-items: center; gap: 6px; flex: none; }

.tm-btn {
  appearance: none; cursor: pointer;
  width: 38px; height: 38px; border-radius: 10px;
  display: grid; place-items: center;
  background: var(--surface-2); color: var(--ink-2);
  border: 1px solid var(--line-2);
  transition: background .15s, color .15s, transform .1s;
}
.tm-btn:hover { background: #1d2130; color: var(--ink); }
.tm-btn:active { transform: scale(.94); }
.tm-btn svg { width: 13px; height: 13px; }

.tm-btn.tm-play {
  width: 46px; height: 46px; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink); border: none;
}
.tm-btn.tm-play svg { width: 16px; height: 16px; }
.tm-btn.tm-play:hover { background: #edff6b; }

.tm-btn.tm-speed {
  width: auto; padding: 0 12px; font-family: var(--mono);
  font-size: 12.5px; font-weight: 700; letter-spacing: .02em;
}

.tm-btn.tm-export-btn, .tm-export {
  width: auto; height: auto; padding: 11px 16px;
  font: 600 13px var(--font); border-radius: 10px;
  background: var(--surface-2); color: var(--ink);
  border: 1px solid var(--line-2); cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px;
  transition: background .15s, border-color .15s;
}
.tm-export:hover { background: #1d2130; border-color: #3a4157; }

.tm-controls { row-gap: 12px; }

@media (max-width: 400px) {
  .tm-transport { gap: 4px; }
  .tm-btn { width: 34px; height: 34px; border-radius: 9px; }
  .tm-btn.tm-play { width: 40px; height: 40px; }
  .tm-btn.tm-speed { padding: 0 9px; font-size: 11.5px; }
  .tm-export, .tm-btn.tm-export-btn { padding: 9px 12px; font-size: 12px; }
}

.tm-ticks {
  position: relative; height: 16px; margin: 0 10px;
}
.tm-tick {
  position: absolute; top: 4px;
  width: 14px; height: 14px; margin-left: -7px;
  transform: rotate(45deg);
  background: var(--bg-2);
  border: 1.5px solid var(--ink-3);
  cursor: pointer; padding: 0;
  transition: border-color .15s, background .15s, transform .15s;
}
.tm-tick:hover, .tm-tick:focus-visible {
  border-color: var(--accent); background: var(--accent);
  transform: rotate(45deg) scale(1.25);
  z-index: 2;
}
.tm-tick.tick-release { border-color: var(--amber); }
.tm-tick.tick-release:hover, .tm-tick.tick-release:focus-visible { background: var(--amber); border-color: var(--amber); }
.tm-tick.tick-moment { border-color: var(--coral); }
.tm-tick.tick-moment:hover, .tm-tick.tick-moment:focus-visible { background: var(--coral); border-color: var(--coral); }

.tm-young {
  font-family: var(--mono); font-size: 12px; color: var(--ink-3);
  flex: 1 1 200px; margin: 0;
}

.tm-note {
  grid-column: 1 / -1;
  font-family: var(--mono); font-size: 11px; color: var(--ink-3);
  margin: 0;
}

.tm-insight {
  margin: 14px 24px 0;
  padding: 12px 16px;
  border-left: 2px solid var(--accent);
  color: var(--ink-2); font-size: 14.5px;
}
@media (max-width: 860px) { .tm-insight { margin: 14px 16px 0; } }

.tm-event {
  position: absolute; top: 10px; left: 12px; z-index: 5;
  max-width: 75%;
  background: rgba(11,12,16,.92);
  border: 1px solid var(--line-2);
  border-left: 3px solid var(--accent);
  border-radius: 10px;
  padding: 10px 14px;
  display: flex; flex-direction: column; gap: 2px;
  opacity: 0; transform: translateY(-6px);
  transition: opacity .35s var(--ease), transform .35s var(--ease);
  pointer-events: none;
}
.tm-event.show { opacity: 1; transform: none; }
.tm-event .te-kind {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .18em;
  text-transform: uppercase; color: var(--accent);
}
.tm-event .te-title { font-size: 15.5px; font-weight: 700; letter-spacing: -0.01em; }
.tm-event .te-sub { font-size: 12.5px; color: var(--ink-2); }
.tm-event .te-date { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-top: 3px; }
@media (max-width: 560px) { .tm-event { max-width: 82%; } }

/* ── export studio ─────────────────────────────────────────────── */

.xs-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(4,5,8,.72);
  backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  animation: xsIn .25s var(--ease);
}
@keyframes xsIn { from { opacity: 0; } to { opacity: 1; } }

.xs {
  width: min(880px, 100%);
  max-height: 88vh;
  overflow-y: auto;
  background: var(--bg-2);
  border: 1px solid var(--line-2);
  border-radius: 18px;
  box-shadow: 0 30px 90px rgba(0,0,0,.6);
}

.xs-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 24px 16px;
  position: sticky; top: 0; background: var(--bg-2); z-index: 3;
  border-bottom: 1px solid var(--line);
}
.xs-head b { font-size: 19px; letter-spacing: -0.02em; display: block; }
.xs-head span { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
.xs-close {
  appearance: none; cursor: pointer;
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--surface-2); color: var(--ink-2);
  border: 1px solid var(--line-2); font-size: 15px;
}
.xs-close:hover { color: var(--ink); border-color: var(--ink-3); }

.xs-theme {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 24px 0;
  font-family: var(--mono); font-size: 12px; color: var(--ink-3);
}
.xs-theme-btn { padding: 7px 14px; font-size: 12.5px; }

.xs-tabs {
  display: flex; gap: 4px; padding: 14px 24px 0;
  overflow-x: auto; scrollbar-width: none;
  position: sticky; top: 73px; background: var(--bg-2); z-index: 3;
}
.xs-tab {
  appearance: none; cursor: pointer; white-space: nowrap;
  font: 600 13.5px var(--font);
  color: var(--ink-3); background: none; border: none;
  padding: 9px 14px; border-radius: 9px;
}
.xs-tab:hover { color: var(--ink); }
.xs-tab.on { color: var(--accent-ink); background: var(--accent); }

.xs-body { padding: 20px 24px 28px; }
.xs-panel > :last-child { margin-bottom: 0; }

.xs-presets {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
}
@media (max-width: 720px) { .xs-presets { grid-template-columns: 1fr; } }
.xs-preset {
  display: flex; flex-direction: column; gap: 10px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; padding: 14px;
}
.xs-preview {
  border-radius: 9px; overflow: hidden;
  border: 1px solid var(--line);
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  min-height: 90px;
}
.xs-preview canvas { width: 100%; height: auto; display: block; }
.xs-pmeta b { display: block; font-size: 14.5px; }
.xs-pmeta span { font-size: 11.5px; color: var(--ink-3); }

.xs-note {
  font-family: var(--mono); font-size: 12px; color: var(--ink-3);
  margin-top: 16px; line-height: 1.6;
}
.xs-note.warn { color: var(--amber); }

.xs-form {
  display: flex; gap: 14px; flex-wrap: wrap; align-items: end;
  font-size: 14px; color: var(--ink-2);
}
.xs-form label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-3); }
.xs-form select {
  font: 500 13.5px var(--mono); color: var(--ink);
  background: var(--surface); border: 1px solid var(--line-2);
  border-radius: 8px; padding: 8px 10px;
}

.xs-prog { margin-top: 16px; }
.xs-prog-bar {
  height: 6px; border-radius: 3px; overflow: hidden;
  background: var(--line);
}
.xs-prog-bar i {
  display: block; height: 100%; width: 0;
  background: var(--accent);
  transition: width .2s var(--ease);
}
.xs-prog span { display: block; margin-top: 8px; font-size: 12px; color: var(--ink-3); }

.xs-webm { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line); }

.xs-svg-preview {
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  background: var(--bg); margin-bottom: 14px;
}
.xs-svg-preview svg { display: block; width: 100%; height: auto; }

.xs-textarea {
  width: 100%; min-height: 260px; resize: vertical;
  font: 400 12.5px/1.7 var(--mono);
  color: var(--ink-2); background: var(--surface);
  border: 1px solid var(--line-2); border-radius: 12px;
  padding: 16px;
}
.xs-row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }

.xs-page h3 { font-size: 18px; margin-bottom: 8px; }
.xs-page p { color: var(--ink-2); font-size: 15px; margin-bottom: 16px; max-width: 56ch; }

@media (prefers-reduced-motion: reduce) {
  .xs-overlay { animation: none; }
  .tm-event { transition: none; }
}

/* ── TM event metric chips ── */
.tm-event .te-metrics {
  display: inline-block; margin: 4px 6px 0 0; padding: 3px 9px;
  border-radius: 999px; background: rgba(var(--accent-rgb),.07);
  border: 1px solid rgba(var(--accent-rgb),.18);
  font-family: var(--mono); font-size: 11.5px; color: var(--accent);
}

/* ══════════════════════════════════════════════════════════════════
   THEMES — eight visual editions of the same story.
   Pure CSS variable overrides; work on <body> or any story container.
   Charts read the same variables, so a re-render is never needed.
   ══════════════════════════════════════════════════════════════════ */

[data-theme="neon"] {
  --bg:#05060A; --bg-2:#080B12; --surface:#0C111C; --surface-2:#111827;
  --line:#1C2739; --line-2:#273549;
  --ink:#EAF2FF; --ink-2:#93A4C3; --ink-3:#5D6E8C;
  --accent:#3DFFB4; --accent-rgb:61,255,180; --accent-ink:#02150D;
  --bar-lit:#0E8F5C; --bar-dim:#1B2A3E; --glow:0 0 24px rgba(61,255,180,.18);
}
[data-theme="paper"] {
  --bg:#F6F2E9; --bg-2:#EFEADC; --surface:#FCFAF4; --surface-2:#F1ECDF;
  --line:#DDD5C2; --line-2:#CBC1A8;
  --ink:#211D14; --ink-2:#5C5442; --ink-3:#8B8065;
  --accent:#9A6B0F; --accent-rgb:154,107,15; --accent-ink:#FFFDF6;
  --bar-lit:#B08D3C; --bar-dim:#E0D8C4; --shadow-1:0 1px 0 rgba(0,0,0,.03) inset, 0 8px 30px rgba(60,50,20,.10);
  --glow:none;
}
[data-theme="terminal"] {
  --bg:#070D08; --bg-2:#0A120B; --surface:#0D1710; --surface-2:#122019;
  --line:#1B2E22; --line-2:#27402F;
  --ink:#C8F7CF; --ink-2:#7FBF8C; --ink-3:#4E7A58;
  --accent:#3EFF6E; --accent-rgb:62,255,110; --accent-ink:#02180A;
  --font: var(--mono);
  --bar-lit:#1D9A46; --bar-dim:#173024;
}
[data-theme="aurora"] {
  --bg:#0A0F1E; --bg-2:#0D1428; --surface:#111A32; --surface-2:#16213F;
  --line:#1D2B4D; --line-2:#2A3B63;
  --ink:#E4ECFF; --ink-2:#94A5D1; --ink-3:#5F6F9B;
  --accent:#7DF9FF; --accent-rgb:125,249,255; --accent-ink:#031418;
  --bar-lit:#2E8FA8; --bar-dim:#1A2747; --glow:0 0 28px rgba(125,249,255,.16);
}
[data-theme="blueprint"] {
  --bg:#081830; --bg-2:#0A1F3D; --surface:#0E2748; --surface-2:#133057;
  --line:#1B3B63; --line-2:#2A4E7E;
  --ink:#DCE9FB; --ink-2:#8FA9CE; --ink-3:#5C77A0;
  --accent:#FFD166; --accent-rgb:255,209,102; --accent-ink:#1E1503;
  --bar-lit:#B8862E; --bar-dim:#17335A; --glow:0 0 24px rgba(255,209,102,.14);
}
[data-theme="mono"] {
  --bg:#FAFAFA; --bg-2:#F2F2F2; --surface:#FFFFFF; --surface-2:#EDEDED;
  --line:#DDDDDD; --line-2:#C4C4C4;
  --ink:#101010; --ink-2:#4A4A4A; --ink-3:#8A8A8A;
  --accent:#101010; --accent-rgb:16,16,16; --accent-ink:#FAFAFA;
  --bar-lit:#3A3A3A; --bar-dim:#E2E2E2; --shadow-1:0 1px 0 rgba(0,0,0,.04) inset, 0 8px 30px rgba(0,0,0,.08);
  --glow:none;
}
[data-theme="sunset"] {
  --bg:#160D14; --bg-2:#1C1019; --surface:#241420; --surface-2:#2C1826;
  --line:#3C2233; --line-2:#4E2C41;
  --ink:#F7EAE2; --ink-2:#C4A193; --ink-3:#8C6B60;
  --accent:#FF9E64; --accent-rgb:255,158,100; --accent-ink:#1E0E05;
  --bar-lit:#A85E33; --bar-dim:#38202f; --glow:0 0 26px rgba(255,158,100,.16);
}

/* theme-specific body treatment */
[data-theme="aurora"] body, body[data-theme="aurora"],
[data-theme="aurora"].cc-story {
  background-image: radial-gradient(60% 40% at 15% -5%, rgba(125,249,255,.06), transparent 60%),
                    radial-gradient(50% 40% at 90% 105%, rgba(180,140,255,.07), transparent 60%);
}
[data-theme="paper"] .hero::before, [data-theme="mono"] .hero::before,
[data-theme="paper"] .cta-final::before, [data-theme="mono"] .cta-final::before { opacity: .35; }

/* ═══ CHARTS READ THEME VARS (timeline + langs) ═══════════════════ */
.tm-chart .tmb { fill: var(--bar-dim); }
.tm-chart .tmb.lit { fill: var(--bar-lit); }
.tm-chart .tmgrid { stroke: var(--line); }
.tm-chart .tmyear { fill: var(--ink-3); }
.tm-chart .tmline { stroke: var(--accent); }
.tm-chart .tmarea-stop { stop-color: var(--accent); }
.tm-chart .tmpointer { stroke: var(--ink); }
.tm-chart .tmdot { fill: var(--accent); stroke: var(--bg); }
.lb-hi { background: var(--accent); }
.lb-md { background: var(--bar-lit); }
.lb-lo { background: var(--bar-dim); }

/* ═══ PROJECT PULSE — signature whole-life visual ════════════════ */
.pulse { padding: var(--sp-16) 0 var(--sp-12); }
.pulse-head { margin-bottom: var(--sp-8); }
.pulse-svg { width: 100%; height: auto; display: block; }
.pulse-svg .pl-area { fill: rgba(var(--accent-rgb), .12); }
.pulse-svg .pl-line { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.pulse-svg .pl-grid { stroke: var(--line); stroke-width: 1; }
.pulse-svg .pl-year { fill: var(--ink-3); font-family: var(--mono); font-size: 10px; }
.pulse-svg .pl-band { opacity: .16; }
.pulse-svg .pl-band.b-silence { fill: var(--ink-3); opacity: .10; }
.pulse-svg .pl-band.b-sprint { fill: var(--accent); }
.pulse-svg .pl-band.b-beginning { fill: var(--blue); }
.pulse-svg .pl-band.b-launch { fill: var(--mint); }
.pulse-svg .pl-band.b-evolution { fill: var(--violet); }
.pulse-svg .pl-band.b-grind { fill: var(--ink-3); }
.pulse-svg .pl-tick { fill: var(--ink-3); }
.pulse-svg .pl-hit { fill: transparent; cursor: crosshair; }
.pulse-svg .pl-cursor { stroke: var(--ink); stroke-dasharray: 3 3; opacity: .7; }
.pulse-svg .pl-dot { fill: var(--accent); stroke: var(--bg); stroke-width: 2; }
.pulse-read { display: flex; gap: var(--sp-8); flex-wrap: wrap; margin-top: var(--sp-4); }
.pulse-fact { font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); }
.pulse-fact b { color: var(--ink); }

/* ═══ STORY COVER (hero) + ARCHETYPE ══════════════════════════════ */
.hero-eyebrow {
  font-family: var(--mono); font-size: 11px; letter-spacing: .38em;
  text-transform: uppercase; color: var(--ink-3); margin-bottom: var(--sp-4);
}
.hero-arch {

  font-weight: 700; letter-spacing: .3em; text-transform: uppercase;
  color: var(--accent); margin-top: var(--sp-3);
  text-shadow: 0 0 22px rgba(var(--accent-rgb), .35);
}
.hero-sub { color: var(--ink-2); font-size: clamp(15px, 2.2vw, 18px); margin-top: var(--sp-4); max-width: 620px; line-height: 1.5; }

/* ═══ STORY DENSITY ═══════════════════════════════════════════════ */
[data-density="compact"] .sec { padding-block: clamp(40px, 7vw, 64px); }
[data-density="compact"] .hero { min-height: auto; padding-block: 96px 64px; }
[data-density="compact"] .sec--extra { display: none; }
[data-density="compact"] .pulse { padding-block: 48px 32px; }
[data-density="cinematic"] .sec { padding-block: clamp(88px, 12vw, 152px); }
[data-density="cinematic"] .hero { min-height: 92vh; }
[data-density="cinematic"] .wrap { max-width: 1080px; }

/* ═══ JUMP-TO-STORY chips ═════════════════════════════════════════ */
.tm-jumps { display: flex; gap: 7px; flex-wrap: wrap; padding: 10px 16px 0; }
.tm-jump {
  appearance: none; cursor: pointer;
  font: 600 11.5px var(--mono); letter-spacing: .04em;
  color: var(--ink-3); background: var(--surface-2);
  border: 1px solid var(--line-2); border-radius: 999px;
  padding: 5px 12px;
  transition: color .15s, border-color .15s, background .15s;
}
.tm-jump:hover { color: var(--accent); border-color: var(--accent); }
.tm-jump.on { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }

/* ═══ STYLE PANEL (theme + density switcher) ══════════════════════ */
.style-fab {
  position: fixed; left: 18px; bottom: 18px; z-index: 80;
  display: inline-flex; align-items: center; gap: 7px;
  font: 600 12px var(--mono); letter-spacing: .05em;
  color: var(--ink-2); background: var(--surface);
  border: 1px solid var(--line-2); border-radius: 999px;
  padding: 9px 14px; cursor: pointer;
  box-shadow: var(--shadow-1);
  transition: color .15s, border-color .15s, transform .15s;
}
.style-fab:hover { color: var(--accent); border-color: var(--accent); transform: translateY(-1px); }
.style-panel {
  position: fixed; left: 18px; bottom: 62px; z-index: 81;
  width: min(300px, calc(100vw - 36px));
  background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-l);
  box-shadow: 0 24px 60px rgba(0,0,0,.45); padding: 16px;
}
.style-panel .sp-h { display: block; font: 700 11px var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px; }
.style-themes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-bottom: 14px; }
.style-th {
  appearance: none; cursor: pointer; border-radius: 10px;
  border: 1px solid var(--line-2); background: var(--bg-2);
  padding: 8px 4px 7px; display: grid; gap: 5px; place-items: center;
  transition: border-color .15s, transform .15s;
}
.style-th:hover { transform: translateY(-2px); }
.style-th.on { border-color: var(--accent); }
.style-th i { width: 26px; height: 12px; border-radius: 4px; display: block; }
.style-th span { font: 600 9.5px var(--mono); letter-spacing: .03em; color: var(--ink-2); }
.style-dens { display: flex; gap: 6px; }
.style-dens button {
  flex: 1; appearance: none; cursor: pointer;
  font: 600 11px var(--mono); color: var(--ink-3);
  background: var(--bg-2); border: 1px solid var(--line-2);
  border-radius: 8px; padding: 7px 4px;
  transition: color .15s, border-color .15s;
}
.style-dens button.on { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.style-note { margin-top: 10px; font-size: 11px; color: var(--ink-3); line-height: 1.5; }

/* ═══ MADE WITH footer signature ══════════════════════════════════ */
.made-with { text-align: center; padding: var(--sp-12) 0 var(--sp-8); border-top: 1px solid var(--line); }
.made-with .mw-label { font: 700 clamp(18px, 3.4vw, 30px) var(--mono); letter-spacing: .3em; color: var(--ink); }
.made-with .mw-label em { font-style: normal; color: var(--accent); }
.made-with .mw-links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: var(--sp-6); }
.made-with .mw-links a, .made-with .mw-links button {
  display: inline-flex; align-items: center; gap: 6px;
  font: 600 13px var(--font); text-decoration: none; cursor: pointer;
  color: var(--ink-2); background: var(--surface-2);
  border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 16px;
  transition: color .15s, border-color .15s, transform .15s;
}
.made-with .mw-links a:hover, .made-with .mw-links button:hover { color: var(--accent); border-color: var(--accent); transform: translateY(-1px); }

@media (prefers-reduced-motion: reduce) {
  .style-fab, .style-th, .tm-jump, .made-with .mw-links a { transition: none; }
}

/* preset chips */
.style-presets { margin-bottom: 2px; }
.style-presets button { font-size: 10.5px; padding: 6px 4px; }

      .sort(function (a, b) { return new Date(b.end) - new Date(a.end); })[0];

  function monthIndexOf(months, isoDate) {
    if (!isoDate) return -1;

  function collectEvents(d) {
    /* deterministic event list: [{idx, kind, title, sub, date}] */
    var months = d.months, evts = [];
    if (!months.length) return evts;
    evts.push({
      idx: 0, kind: "beginning", title: "The Beginning",
      sub: "“" + (months[0].msg || "first commit") + "”",
      date: d.repo.first,
    });
    (d.tags || []).forEach(function (t) {
      if (!t.date) return;
      var i = monthIndexOf(months, t.date);
      if (i > 0) evts.push({ idx: i, kind: "release", title: t.name + " released", sub: "a version shipped to the world", date: t.date });
    });
    (d.chapters || []).forEach(function (c) {
      if (c.kind === "silence") {
        var i = monthIndexOf(months, c.end);
        if (i > 0) evts.push({ idx: i, kind: "comeback", title: "The Comeback", sub: c.subtitle || "the silence ends", date: c.end });
      }
      if (c.kind === "sprint") {
        var best = months.reduce(function (a, b) { return (b.commits > a.commits ? b : a); });
        var i = monthIndexOf(months, best.key + "-01");
        if (i > 0) evts.push({ idx: i, kind: "burst", title: "The Sprint", sub: best.commits + " commits in " + best.label, date: best.key + "-01" });

    var cc = 0, mg = 0, people = 0;
    months.forEach(function (m) {
      cc += m.commits; mg += m.merges; people += m.new_contributors || 0;
      cumCommits.push(cc); cumMerges.push(mg); cumPeople.push(people);
    });

    var defs = [
      { label: "commits", get: function (i) { return fN(cumCommits[i]); } },
      { label: "this month", get: function (i) { return fN(months[i].commits); } },
      { label: "people", get: function (i) { return fN(cumPeople[i]); } },
      { label: "merges", get: function (i) { return fN(cumMerges[i]); } },
    ];
    if (hasCode) {
      defs.push({ label: "files", get: function (i) { return fN(months[i].files_end); } });
      defs.push({ label: "lines of code", get: function (i) { return fK(months[i].net_end); } });
    } else {
      defs.push({ label: "active days / mo", get: function (i) { return fN(months[i].active_days); } });
    }
    var counterNodes = [];
    defs.forEach(function (def) {
      var c = el("div", "tm-counter");
      c.innerHTML = "<span>" + esc(def.label) + "</span>";
      var b = el("b", null, "—");
      c.appendChild(b);
      counters.appendChild(c);
      counterNodes.push(b);
    });
    if (!hasCode) {
      var note = el("p", "tm-note");
      note.textContent = "Code size & languages need the local CLI — every other number here is real.";
      counters.appendChild(note);
    }

    buildTimelineChart(chart, months, function (idx) { /* onChange handled globally */ });

    /* events by index */
    var evtByIndex = {};
    var eventIdxList = events.map(function (e) { return e.idx; }).filter(function (ix, i, a) { return a.indexOf(ix) === i; }).sort(function (a, b) { return a - b; });
    function prevEventIx(from) {
      for (var i = eventIdxList.length - 1; i >= 0; i--) if (eventIdxList[i] < from - 0.5) return eventIdxList[i];
      return 0;
    }
    function nextEventIx(from) {
      for (var i = 0; i < eventIdxList.length; i++) if (eventIdxList[i] > from + 0.5) return eventIdxList[i];
      return months.length - 1;
    }
    events.forEach(function (e) {
      if (!evtByIndex[e.idx]) evtByIndex[e.idx] = e;
    });

    var cur = Math.max(months.length - 1, 0);
    var raf = null, playing = false;
    var speeds = [0.5, 1, 1.5, 2];
    var speedIx = 1;

    function updateEvent(i) {
      var e = evtByIndex[i];
      if (e) {
        /* derived, honest metrics: what this month actually added */
        var m1 = months[e.idx] || months[months.length - 1];
        var m0 = months[Math.max(0, e.idx - 1)] || m1;
        var chips = [];
        if (m1.commits) chips.push("+" + fN(m1.commits) + " commits");
        if (m1.new_contributors) chips.push("+" + fN(m1.new_contributors) + " contributors");
        if (m1.files_end && m0.files_end && m1.files_end - m0.files_end) chips.push((m1.files_end - m0.files_end > 0 ? "+" : "") + fN(m1.files_end - m0.files_end) + " files");
        if (m1.net_end !== undefined && m0.net_end !== undefined && m1.net_end - m0.net_end) chips.push((m1.net_end - m0.net_end > 0 ? "+" : "") + fK(Math.abs(m1.net_end - m0.net_end)) + " lines");
        evtOverlay.innerHTML =
          '<span class="te-kind">' + esc(e.kind) + "</span>" +
          '<b class="te-title">' + esc(e.title) + "</b>" +
          '<span class="te-sub">' + esc(e.sub) + "</span>" +
          (chips.length ? '<span class="te-metrics">' + chips.slice(0, 3).map(esc).join("</span><span class='te-metrics'>") + "</span>" : "") +
          '<span class="te-date">' + esc(fmtDate(e.date)) + "</span>";
        evtOverlay.classList.add("show");
      } else {
        evtOverlay.classList.remove("show");
      }
    }

    var lastFloor = -1;
    function lerpN(a, b, t) { return a + (b - a) * t; }
    function smoothCounters(fl, t) {
      var nx = Math.min(fl + 1, months.length - 1);
      counterNodes[0].textContent = fN(lerpN(cumCommits[fl], cumCommits[nx], t));
      counterNodes[1].textContent = fN(lerpN(months[fl].commits, months[nx].commits, t));
      counterNodes[2].textContent = fN(lerpN(cumPeople[fl], cumPeople[nx], t));
      counterNodes[3].textContent = fN(lerpN(cumMerges[fl], cumMerges[nx], t));
      if (hasCode) {
        counterNodes[4].textContent = fN(lerpN(months[fl].files_end || 0, months[nx].files_end || 0, t));
        counterNodes[5].textContent = fK(lerpN(months[fl].net_end || 0, months[nx].net_end || 0, t));
      } else {
        counterNodes[4].textContent = fN(lerpN(months[fl].active_days || 0, months[nx].active_days || 0, t));
      }
    }
    function setIndex(i, fromUser) {
      cur = Math.max(0, Math.min(months.length - 1, i));
      var fl = cur | 0, t = cur - fl;
      range.value = fl;
      range.style.setProperty("--fill", (months.length < 2 ? 100 : (cur / (months.length - 1)) * 100) + "%");
      /* counters + chart pointer animate every frame — smooth, no snapping */
      smoothCounters(fl, t);
      chart.update(cur);
      /* month-anchored content swaps only when the month actually changes */
      if (fl !== lastFloor) {
        lastFloor = fl;
        var m = months[fl];
        var yr = Math.floor(fl / 12) + 1, yrs = Math.max(1, Math.ceil(months.length / 12));
        dateline.innerHTML = "<b>" + esc(m.label) + "</b><span>year " + yr + " of " + yrs + " · " + fN(cumCommits[fl]) + " commits total</span>";
        msg.querySelector(".msgtxt").textContent = m.msg ? "“" + m.msg + "”" : "—";
        renderLangs(langZone, m.langs, hasCode);
        updateEvent(fl);
      }
      if (fromUser) stop();
    }
    function stop() {
      playing = false;
      if (raf) cancelAnimationFrame(raf), raf = null;
      play.innerHTML = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg>';
      play.setAttribute("aria-label", "Play the project timeline");
      play.title = "Play the project timeline";
    }
    function start() {
      if (!multi) return;
      playing = true;
      play.innerHTML = '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="2.5" width="3.4" height="11" rx="1"/><rect x="9.6" y="2.5" width="3.4" height="11" rx="1"/></svg>';
      play.setAttribute("aria-label", "Pause the project timeline");
      play.title = "Pause";
      var base = Math.max(months.length / 14, 1.6);   /* 1× ≈ 14s journey */
      /* smart pacing: slow down near meaningful events, cruise between them */
      var near = eventIdxList.some(function (ix) { return Math.abs(cur - ix) < 0.8; });
      var rate = base * speeds[speedIx] * (near ? 0.32 : 1);
      var last = null;
      function frame(t) {
        if (!playing) return;
        if (last === null) last = t;
        cur += (t - last) / 1000 * rate;
        last = t;
        if (cur >= months.length - 1) { setIndex(months.length - 1); stop(); return; }
        setIndex(cur);
        raf = requestAnimationFrame(frame);
      }
      raf = requestAnimationFrame(frame);
    }
    play.addEventListener("click", function () {
      if (playing) return stop();
      if (cur >= months.length - 1) cur = 0;
      start();
    });
    bFirst.addEventListener("click", function () { setIndex(0, true); });
    bLast.addEventListener("click", function () { setIndex(months.length - 1, true); });
    bPrev.addEventListener("click", function () { setIndex(prevEventIx(cur), true); });
    bNext.addEventListener("click", function () { setIndex(nextEventIx(cur), true); });
    speed.addEventListener("click", function () {
      speedIx = (speedIx + 1) % speeds.length;
      speed.textContent = speeds[speedIx] + "×";
      speed.setAttribute("aria-label", "Playback speed: " + speeds[speedIx] + "×");
    });
    range.addEventListener("input", function () { setIndex(+range.value, true); });

    /* keyboard: ← → step months, space toggles play, home/end jump —
       active whenever the time machine is on screen and nothing else wants the keys */
    tm.setAttribute("tabindex", "-1");
    document.addEventListener("keydown", function onKey(e) {
      if (document.querySelector(".xs-overlay")) return;
      var tag = (document.activeElement && document.activeElement.tagName) || "";
      if (/^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(tag) && document.activeElement !== tm) return;
      var inView = false;
      try {
        var r = tm.getBoundingClientRect();
        inView = (r.height === 0 && r.top === 0) /* no layout (tests) */ || (r.top < innerHeight && r.bottom > 0);
      } catch (err) { inView = true; }
      if (!inView) return;
      if (e.key === "ArrowLeft") { e.preventDefault(); setIndex(cur - 1, true); }
      else if (e.key === "ArrowRight") { e.preventDefault(); setIndex(cur + 1, true); }
      else if (e.key === " ") { e.preventDefault(); play.click(); }
      else if (e.key === "Home") { e.preventDefault(); setIndex(0, true); }
      else if (e.key === "End") { e.preventDefault(); setIndex(months.length - 1, true); }
    });

    /* export hook */
    var exBtn = el("button", "btn tm-export");
    exBtn.type = "button";
    exBtn.innerHTML = "Export animation ⤓";
    exBtn.addEventListener("click", function () { openExportStudio(d, "animation"); });
    controls.appendChild(exBtn);

    setIndex(cur);
  }

  function renderLangs(zone, langs, hasCode) {
    zone.innerHTML = "";
    if (!hasCode || !langs) return;
    var entries = Object.keys(langs).map(function (k) { return [k, langs[k]]; })
      .sort(function (a, b) { return b[1] - a[1]; }).slice(0, 5);
    if (!entries.length) return;
    var total = entries.reduce(function (a, e) { return a + e[1]; }, 0) || 1;
    var max = entries[0][1];
    var head = el("div", null, '<span class="lbl">The codebase, by language</span>');
    zone.appendChild(head);
    entries.forEach(function (e) {
      var row = el("div", "langbar");
      row.innerHTML =
        "<span>" + esc(e[0]) + "</span>" +
        '<div class="track"><i class="fill" style="width:' + Math.max(3, (e[1] / max) * 100) + "%;background:" + (LANG_COLORS[e[0]] || LANG_COLORS.Other) + '"></i></div>' +
        '<span class="pc">' + Math.round((e[1] / total) * 100) + "%</span>";
      zone.appendChild(row);
    });
  }

  function buildTimelineChart(container, months, onChange) {
    var W = 720, H = 230, PADB = 26, PADT = 14, PADL = 6, PADR = 6;
    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, role: "img",
      "aria-label": "Timeline chart: monthly commits as bars and cumulative commits as a line" });
    var iw = W - PADL - PADR, ih = H - PADT - PADB;
    var n = months.length;
    var maxMonthly = Math.max.apply(null, months.map(function (m) { return m.commits; }));
    var cum = 0, cums = months.map(function (m) { return cum += m.commits; });
    var maxCum = Math.max(cums[n - 1], 1);
    var bw = Math.max(2, Math.min(26, iw / n - 2));

    var lastYear = null;
    months.forEach(function (m, i) {
      var yr = m.key.slice(0, 4);
      if (yr !== lastYear) {
        lastYear = yr;
        var x = PADL + (n < 2 ? 0 : (i / (n - 1)) * iw);
        svg.appendChild(svgEl("line", { x1: x, y1: PADT, x2: x, y2: H - PADB, "class": "tmgrid", "stroke-width": 1 }));
        var t = svgEl("text", { x: x + 4, y: H - 8, "class": "tmyear", "font-size": 10 });
        t.textContent = yr;
        svg.appendChild(t);
      }
    });

    var bars = months.map(function (m, i) {
      var h = maxMonthly ? (m.commits / maxMonthly) * (ih * 0.62) : 0;
      var x = PADL + (n < 2 ? iw / 2 : (i / (n - 1)) * iw);
      var r = svgEl("rect", {
        x: x - bw / 2, y: PADT + ih - h, width: bw, height: Math.max(h, m.commits ? 1.5 : 0),
        rx: Math.min(2, bw / 3), "class": "tmb",
      });
      if (m.commits) {
        var tt = el("title");
        tt.textContent = m.label + " — " + m.commits + " commits";
        r.appendChild(tt);
      }
      svg.appendChild(r);
      return r;
    });

    var pts = cums.map(function (c, i) {
      var x = PADL + (n < 2 ? iw / 2 : (i / (n - 1)) * iw);
      var y = PADT + ih - (c / maxCum) * (ih * 0.92);
      return [x, y];
    });
    var lineD = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
    var areaD = lineD + " L" + pts[pts.length - 1][0].toFixed(1) + " " + (PADT + ih) + " L" + pts[0][0].toFixed(1) + " " + (PADT + ih) + " Z";
    var defs = svgEl("defs");
    var grad = svgEl("linearGradient", { id: "ccgrad", x1: 0, y1: 0, x2: 0, y2: 1 });
    grad.appendChild(svgEl("stop", { offset: "0%", "class": "tmarea-stop", "stop-opacity": 0.28 }));
    grad.appendChild(svgEl("stop", { offset: "100%", "class": "tmarea-stop", "stop-opacity": 0 }));
    defs.appendChild(grad);
    svg.appendChild(defs);
    svg.appendChild(svgEl("path", { d: areaD, fill: "url(#ccgrad)" }));
    svg.appendChild(svgEl("path", { d: lineD, fill: "none", "class": "tmline", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));

    var pointer = svgEl("line", { x1: 0, y1: PADT, x2: 0, y2: H - PADB, "class": "tmpointer", "stroke-width": 1, "stroke-dasharray": "3 3", opacity: 0.7 });
    var dot = svgEl("circle", { r: 4.5, "class": "tmdot", "stroke-width": 2 });
    svg.appendChild(pointer); svg.appendChild(dot);
    svg.appendChild(svgEl("line", { x1: PADL, y1: PADT + ih, x2: W - PADR, y2: PADT + ih, "class": "tmgrid" }));

    container.appendChild(svg);

    function update(i) {
      var x = PADL + (n < 2 ? iw / 2 : (i / (n - 1)) * iw);
      pointer.setAttribute("x1", x); pointer.setAttribute("x2", x);
      dot.setAttribute("cx", x);
      dot.setAttribute("cy", pts[Math.round(Math.max(0, Math.min(i, n - 1)))][1]);
      var lit = Math.floor(i + 1e-4);
      for (var k = 0; k < bars.length; k++) bars[k].classList.toggle("lit", k <= lit);
      if (onChange) onChange(lit);
    }
    container.update = update;
    return update;
  }
  /* ── rhythm ───────────────────────────────────────────────────── */

  function rhythm(root, d) {
    var t = d.totals, clock = d.clock;
    var wrap = section(root, "rhythm", "When the work happened", "The rhythm",
      "Every repository has a pulse — favorite hours, heavy weekdays, quiet seasons.");

    var grid = el("div", "rhythm-grid");

    /* punchcard */
    var p1 = el("div", "panel");
    var days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    var maxCell = 1;
    clock.grid.forEach(function (row) { row.forEach(function (v) { maxCell = Math.max(maxCell, v); }); });
    var ph = clock.peak_hour, pd = clock.peak_weekday;
    p1.innerHTML = "<h3>The punch card</h3><p class='psub'>peak: " + days[pd] + " around " + (ph < 10 ? "0" : "") + ph + ":00</p>";
    var pw = el("div", "punch-wrap");
    var punch = el("div", "punch");
    var summary = "Heat map of commits by weekday and hour. Peak activity " + days[pd] + " near " + ph + ":00. ";
    clock.grid.forEach(function (row, di) {
      punch.appendChild(el("div", "plabel", days[di]));
      var prow = el("div", "prow");
      row.forEach(function (v, hi) {
        var frac = v / maxCell;
        var c = el("div", "punch-cell");
        var size = 26 + frac * 74;
        c.style.width = size + "%";
        c.style.margin = "0 auto";
        c.style.borderRadius = "50%";
        c.style.aspectRatio = "1";
        if (v) {
          c.className = "punch-cell lb-" + (frac > 0.66 ? "hi" : frac > 0.33 ? "md" : "lo");
          c.title = days[di] + " " + (hi < 10 ? "0" : "") + hi + ":00 — " + v + " commits";
        }
        prow.appendChild(c);
      });
      punch.appendChild(prow);
    });
    var hrs = el("div", "plabel");
    hrs.style.height = "0";
    punch.appendChild(el("div", null, ""));
    var hourRow = el("div", null);
    hourRow.style.gridColumn = "2";
    var hlabels = el("div", "phours");
    for (var h = 0; h < 24; h += 3) hlabels.appendChild(el("span", null, h + ""));
    hourRow.appendChild(hlabels);
    punch.appendChild(hourRow);
    pw.appendChild(punch);
    p1.appendChild(pw);
    var sr = el("p", "sr-only", summary);
    p1.appendChild(sr);

    /* calendar */
    var p2 = el("div", "panel");
    var cal = d.calendar;
    var maxDay = 1;
    cal.days.forEach(function (v) { maxDay = Math.max(maxDay, v); });
    var totalCommits = fN(t.commits);
    p2.innerHTML = "<h3>The whole life, at a glance</h3><p class='psub'>every day from first commit to last</p>";
    var scroll = el("div", "cal-scroll");
    var byYear = {};
    var startMs = new Date(cal.start).getTime();
    cal.days.forEach(function (v, i) {
      var dt = new Date(startMs + i * 86400000);
      var y = dt.getFullYear();
      (byYear[y] = byYear[y] || []).push([dt, v]);
    });
    var activeYearDays = {};
    Object.keys(byYear).forEach(function (y) {
      activeYearDays[y] = byYear[y].filter(function (x) { return x[1] > 0; }).length;
    });
    Object.keys(byYear).forEach(function (y) {
      var yr = el("div", "cal-year");
      yr.innerHTML = "<div class='yl'><span>" + y + "</span><span>" + activeYearDays[y] + " active days</span></div>";
      var row = el("div", "cal-row");
      byYear[y].forEach(function (pair) {
        var v = pair[1];
        var lvl = v === 0 ? 0 : v <= maxDay * 0.25 ? 1 : v <= maxDay * 0.5 ? 2 : v <= maxDay * 0.75 ? 3 : 4;
        var cell = el("div", "cal-cell c" + lvl);
        if (v) cell.title = pair[0].toISOString().slice(0, 10) + " — " + v + " commits";
        row.appendChild(cell);
      });
      yr.appendChild(row);
      scroll.appendChild(yr);
    });
    p2.appendChild(scroll);
    var legend = el("div", "cal-legend");
    legend.innerHTML = "less " +
      '<span class="cal-cell c0"></span><span class="cal-cell c1"></span><span class="cal-cell c2"></span><span class="cal-cell c3"></span><span class="cal-cell c4"></span>' +
      " more";
    p2.appendChild(legend);
    p2.appendChild(el("p", "sr-only",
      "Calendar of daily commits across the project life. " + totalCommits + " commits over " + cal.days.length + " days. Busiest day had " + t.biggest_day + " commits."));

    grid.appendChild(p1); grid.appendChild(p2);
    wrap.appendChild(grid);

    var sf = el("div", "streak-facts");
    var items = [
      [t.longest_streak + " days", "longest streak"],
      [t.active_days, "total active days"],
      [t.night_pct + "%", "commits at night (10pm–5am)"],
      [t.weekend_pct + "%", "weekend commits"],
    ];
    items.forEach(function (it) {
      sf.appendChild(el("div", "sf", "<b>" + it[0] + "</b><span>" + it[1] + "</span>"));
    });
    wrap.appendChild(sf);
  }

  /* ── fingerprint ──────────────────────────────────────────────── */

  function fingerprint(root, d) {
    var fp = d.fingerprint;
    var wrap = section(root, "fingerprint", "Git behavior, honestly measured", "The developer fingerprint",
      "Derived from " + fp.commits + " commits by the most active author — behavior, not psychology.");

    var box = el("div", "fp");
    var left = el("div", "fp-archetype");
    left.innerHTML =
      '<div class="a-icon" aria-hidden="true">' + fp.archetype.icon + "</div>" +
      "<h3>" + esc(fp.archetype.label) + "</h3>" +
      '<p class="a-tag">' + esc(fp.archetype.tagline) + "</p>" +
      '<p class="fp-who"><b>' + esc(fp.author) + "</b> · " + fp.pct + "% of commits · since " + esc(fp.active_since) + "</p>";
    if (fp.runners && fp.runners.length) {
      var r = el("div", "fp-runners");
      fp.runners.forEach(function (name) { r.appendChild(chip(esc(name))); });
      left.appendChild(r);
    }
    left.appendChild(el("p", "fp-note", esc(fp.footnote || "")));

    var side = el("div", "fp-side");
    var hours = el("div", null);
    hours.innerHTML = "<h3 style='font-size:15px;margin-bottom:12px'>Favorite hours <span style='color:var(--ink-3);font-family:var(--mono);font-size:11px'>(commits by hour)</span></h3>";
    var bars = el("div", "hourbars");
    var maxH = Math.max.apply(null, fp.hours.concat([1]));
    var peak = fp.hours.indexOf(Math.max.apply(null, fp.hours));
    fp.hours.forEach(function (v, i) {
      var b = el("div", (i === peak ? "hot" : ""));
      b.style.height = Math.max(2, (v / maxH) * 100) + "%";
      b.title = (i < 10 ? "0" : "") + i + ":00 — " + v + " commits";
      bars.appendChild(b);
    });
    hours.appendChild(bars);
    var scale = el("div", "hour-scale");
    scale.innerHTML = "<span>00</span><span>06</span><span>12</span><span>18</span><span>24</span>";
    hours.appendChild(scale);
    side.appendChild(hours);

    var traits = el("ul", "fp-traits");
    (fp.traits || []).forEach(function (tr) { traits.appendChild(el("li", null, esc(tr))); });
    side.appendChild(traits);

    box.appendChild(left); box.appendChild(side);
    wrap.appendChild(box);
  }

  /* ── people ───────────────────────────────────────────────────── */

  function people(root, d) {
    var wrap = section(root, "people", "The humans behind the hashes", "The people",
      d.totals.contributors === 1
        ? "One name on every commit. Full ownership."
        : d.totals.contributors + " people wrote this story.");
    var list = el("div", "people");
    d.contributors.forEach(function (p, i) {
      var row = el("div", "person");
      var nameZone = el("div", "pname");
      nameZone.innerHTML = esc(p.name) + (p.badge ? '<span class="badge ' + p.badge + '">' + p.badge + "</span>" : "") +
        "<small>" + esc(p.first) + " → " + esc(p.last) + "</small>";
      var zone = el("div", "pbar-zone");
      var bar = el("div", "pbar");
      var fill = el("i");
      fill.style.width = Math.max(2, p.pct) + "%";
      bar.appendChild(fill);
      zone.appendChild(bar);
      zone.appendChild(el("span", "pct", p.pct + "%"));
      row.appendChild(el("span", "rank", String(i + 1).padStart(2, "0")));
      row.appendChild(nameZone);
      row.appendChild(zone);
      row.appendChild(el("span", "rank", fN(p.commits)));
      list.appendChild(row);
    });
    wrap.appendChild(list);
  }

  /* ── moment + glow up ─────────────────────────────────────────── */

  /* ── EXPORT STUDIO ────────────────────────────────────────────── */

  var THEMES = {
    dark: { bg: "#0B0C10", ink: "#E9EBF3", dim: "#9BA1B5", faint: "#687089",
            accent: "#E2FF3A", accentInk: "#151803", line: "#2E3344",
            bar: "#7b9a1d", area: "rgba(226,255,58,0.14)" },
    light: { bg: "#F7F7F2", ink: "#14161D", dim: "#4d5261", faint: "#8a8f9e",
             accent: "#7E9A00", accentInk: "#F7F7F2", line: "#d9d9cf",
             bar: "#9db32a", area: "rgba(126,154,0,0.15)" },

  function fitFont(x, text, base, family, weight, maxW) {
    var size = base;
    do {
      x.font = (weight || "700") + " " + size + "px " + family;
      size -= 3;
    } while (x.measureText(text).width > maxW && size > 18);
  }

  function drawCard(d, kind, themeName) {
    var t = d.totals, r = d.repo, sh = d.shape, fp = d.fingerprint;
    var th = THEMES[themeName] || THEMES.dark;
    var W = { og: 1200, square: 1080, story: 1080, banner: 1280 }[kind] || 1200;
    var H = { og: 630, square: 1080, story: 1920, banner: 320 }[kind] || 630;
    var canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = H;
    var x = canvas.getContext && canvas.getContext("2d");
    if (!x) return canvas;
    var MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    var SANS = 'ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';

    x.fillStyle = th.bg; x.fillRect(0, 0, W, H);
    if (themeName !== "light") {
      var glow = x.createRadialGradient(W * 0.85, kind === "story" ? H * 0.1 : -H * 0.15, 10, W * 0.85, kind === "story" ? H * 0.1 : -H * 0.15, W * 0.7);
      glow.addColorStop(0, "rgba(226,255,58,0.13)");
      glow.addColorStop(1, "rgba(226,255,58,0)");
      x.fillStyle = glow; x.fillRect(0, 0, W, H);
    }
    var M = Math.round(W * (kind === "banner" ? 0.025 : 0.05));
    x.strokeStyle = th.line; x.lineWidth = Math.max(2, W / 600);
    x.strokeRect(M, M, W - M * 2, H - M * 2);

    function stat(cx, cy, val, label, vs, ls) {
      x.fillStyle = th.ink;
      x.font = "700 " + vs + "px " + MONO;
      x.fillText(val, cx, cy);
      x.fillStyle = th.faint;
      x.font = "500 " + ls + "px " + MONO;
      x.fillText(label.toUpperCase(), cx, cy + vs * 0.55);
    }
    function spark(sx, sy, sw, shh, lw) {
      var months = d.months;
      var maxC = Math.max.apply(null, months.map(function (m) { return m.commits; })) || 1;
      var step = sw / Math.max(months.length - 1, 1);
      x.beginPath();
      months.forEach(function (m, i) {
        var px = sx + i * step, py = sy + shh - (m.commits / maxC) * shh;
        i ? x.lineTo(px, py) : x.moveTo(px, py);

      x.lineTo(sx + sw, sy + shh); x.lineTo(sx, sy + shh); x.closePath();
      x.fillStyle = th.area; x.fill();
    }
    function tryLetterSpacing(v) { try { x.letterSpacing = v; } catch (e) {} }

    if (kind === "og") {
      x.fillStyle = th.faint; x.font = "600 15px " + MONO;
      tryLetterSpacing("6px");
      x.fillText("THE STORY OF", M + 40, M + 52); tryLetterSpacing("0px");
      x.fillStyle = th.ink;
      fitFont(x, r.name, 66, SANS, "800", W - (M + 40) * 2);
      x.fillText(r.name, M + 40, M + 140);
      x.fillStyle = th.accent; x.font = "700 24px " + SANS;
      x.fillText(sh.label, M + 40, M + 184);
      x.fillStyle = th.dim; x.font = "400 16px " + MONO;
      x.fillText(fmtDate(r.first) + " — " + fmtDate(r.last) + " · " + r.age_label, M + 40, M + 224);
      spark(M + 40, H - 252, W - (M + 40) * 2, 54, 3);
      var gy = H - 160, colW = (W - (M + 40) * 2) / 3;
      var stats = [[fN(t.commits), "commits"], [fN(t.contributors), "contributors"], [fN(t.active_days), "active days"],
                   [t.longest_streak + " days", "longest streak"], [t.night_pct + "%", "at night"], [fK(t.lines_added), "lines added"]];
      stats.forEach(function (s, i) {
        stat(M + 40 + (i % 3) * colW, gy + Math.floor(i / 3) * 78, s[0], s[1], 30, 12);
      });
      x.fillStyle = th.dim; x.font = "600 16px " + SANS;
      x.fillText(fp.archetype.icon + "  " + fp.archetype.label + " — " + fp.author, M + 40, H - M - 52);
      x.fillStyle = th.faint; x.font = "500 13px " + MONO;
      x.fillText("commit canvas · real git data · generated locally", M + 40, H - M - 28);
    } else if (kind === "square") {
      x.textAlign = "center";
      x.fillStyle = th.faint; x.font = "600 22px " + MONO; tryLetterSpacing("8px");
      x.fillText("THE STORY OF", W / 2, M + 110); tryLetterSpacing("0px");
      x.fillStyle = th.ink;
      fitFont(x, r.name, 92, SANS, "800", W - 260);
      x.fillText(r.name, W / 2, M + 240);
      x.fillStyle = th.accent; x.font = "700 40px " + SANS;
      x.fillText(sh.label, W / 2, M + 320);
      x.fillStyle = th.dim; x.font = "400 26px " + MONO;
      x.fillText(fmtDate(r.first) + " — " + fmtDate(r.last) + " · " + r.age_label, W / 2, M + 372);
      spark(M + 110, M + 430, W - 220, 130, 6);
      var colW2 = (W - 220) / 3, gy2 = M + 640;
      var stats2 = [[fN(t.commits), "commits"], [fN(t.active_days), "active days"], [t.longest_streak + "d", "longest streak"],
                    [fN(t.contributors), "contributors"], [t.night_pct + "%", "at night"], [fK(t.lines_added), "lines added"]];
      x.textAlign = "left";
      stats2.forEach(function (s, i) {
        stat(M + 110 + (i % 3) * colW2, gy2 + Math.floor(i / 3) * 150, s[0], s[1], 54, 19);
      });
      x.textAlign = "center";
      x.fillStyle = th.dim; x.font = "600 28px " + SANS;
      x.fillText(fp.archetype.icon + " " + fp.archetype.label, W / 2, H - M - 120);
      x.fillStyle = th.faint; x.font = "500 20px " + MONO;
      x.fillText("commit canvas · generated locally from real git data", W / 2, H - M - 74);
      x.textAlign = "left";
    } else if (kind === "story") {
      x.fillStyle = th.faint; x.font = "600 22px " + MONO; tryLetterSpacing("6px");
      x.fillText("THE STORY OF", M + 40, M + 90); tryLetterSpacing("0px");
      x.fillStyle = th.ink;
      fitFont(x, r.name, 110, SANS, "800", W - (M + 40) * 2);
      x.fillText(r.name, M + 40, M + 210);
      x.fillStyle = th.accent; x.font = "700 34px " + SANS;
      x.fillText(sh.label, M + 40, M + 280);
      x.fillStyle = th.dim; x.font = "400 24px " + MONO;
      x.fillText(fmtDate(r.first) + " — " + fmtDate(r.last) + " · " + r.age_label, M + 40, M + 336);
      var gy3 = M + 470, colW3 = (W - (M + 40) * 2) / 3;
      var stats3 = [[fN(t.commits), "commits"], [fN(t.contributors), "contributors"], [fN(t.active_days), "active days"],
                    [t.longest_streak + " days", "longest streak"], [t.night_pct + "%", "at night"], [fK(t.lines_added), "lines added"]];
      stats3.forEach(function (s, i) {
        stat(M + 40 + (i % 3) * colW3, gy3 + Math.floor(i / 3) * 170, s[0], s[1], 56, 20);
      });
      spark(M + 40, gy3 + 400, W - (M + 40) * 2, 150, 5);
      x.fillStyle = th.dim; x.font = "600 26px " + SANS;
      x.fillText(fp.archetype.icon + "  " + fp.archetype.label + " — " + fp.author, M + 40, H - M - 90);
      x.fillStyle = th.faint; x.font = "500 20px " + MONO;
      x.fillText("commit canvas · real git data · generated locally", M + 40, H - M - 48);
    } else { /* banner */
      x.fillStyle = th.ink;
      fitFont(x, r.name, 58, SANS, "800", 560);
      x.fillText(r.name, M + 36, M + 84);
      x.fillStyle = th.accent; x.font = "700 22px " + SANS;
      x.fillText(sh.label + " · " + r.age_label, M + 36, M + 126);
      x.fillStyle = th.dim; x.font = "400 15px " + MONO;
      x.fillText(fN(t.commits) + " commits · " + fN(t.contributors) + " contributors · " + t.longest_streak + "-day streak", M + 36, H - M - 42);
      spark(660, M + 46, W - 660 - (M + 40), 140, 3);
      x.fillStyle = th.faint; x.font = "500 13px " + MONO;
      x.textAlign = "right";
      x.fillText("commit canvas", W - M - 36, H - M - 42);

    }
